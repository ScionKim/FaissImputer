name: Analyze available selected-distance results

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/analyze-available-selected-distances.yml"
      - "benchmarks/analyze_available_selected_distances.py"
      - "benchmarks/results/available-selected-distances*.zip*"
      - "benchmarks/results/available-selected-distances-c02b71d-summary.json"
      - "docs/benchmarks/available-selected-distances-c02b71d.md"

permissions:
  contents: read

jobs:
  analyze:
    name: Regenerate optimization comparison and same-code control
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Generate report and exact summary from the preserved ZIPs
        run: |
          python benchmarks/analyze_available_selected_distances.py \
            --report benchmark_outputs/available-selected-distances-c02b71d.md \
            --summary benchmark_outputs/available-selected-distances-c02b71d-summary.json

      - name: Compare with committed analysis when present
        shell: bash
        run: |
          report="docs/benchmarks/available-selected-distances-c02b71d.md"
          summary="benchmarks/results/available-selected-distances-c02b71d-summary.json"
          if [[ -e "$report" || -e "$summary" ]]; then
            diff -u "$report" benchmark_outputs/available-selected-distances-c02b71d.md
            diff -u "$summary" benchmark_outputs/available-selected-distances-c02b71d-summary.json
          else
            echo "Initial generation: report and summary are available in the analysis artifact."
          fi

      - name: Upload regenerated analysis
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: available-selected-distances-c02b71d-analysis-${{ github.run_id }}-${{ github.run_attempt }}
          path: benchmark_outputs/
          if-no-files-found: error
          retention-days: 30
