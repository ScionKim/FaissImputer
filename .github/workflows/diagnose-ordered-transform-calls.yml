name: Diagnose ordered transform calls

# This revision runs only diagnosis 1. A second diagnosis needs evaluation of
# these artifacts and a deliberate implementation for one strongest hypothesis.
# Keep a human run ledger: the token and attempt guard do not count prior runs.
on:
  push:
    branches:
      - diagnose/ordered-transform-calls
    paths:
      - benchmarks/diagnose_ordered_transform_calls.py
      - benchmarks/specs/validation_0.3.22_v1.json
      - .github/workflows/diagnose-ordered-transform-calls.yml
      - tests/test_ordered_transform_diagnostic.py
  workflow_dispatch:
    inputs:
      run_number:
        description: Initial diagnosis only; follow-up requires an evaluated revision
        type: choice
        required: true
        default: '1'
        options:
          - '1'
      first_run_confirmed:
        description: I checked the run ledger and this is the first actual diagnostic run
        type: boolean
        required: true
        default: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ordered-transform-calls-${{ github.ref }}
  cancel-in-progress: false

env:
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  BLIS_NUM_THREADS: '1'
  VECLIB_MAXIMUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  PIP_NO_INPUT: '1'

jobs:
  reject-invalid-request:
    if: >-
      (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[ordered-diagnostic-1]')) &&
      (github.run_attempt != '1' || github.ref != 'refs/heads/diagnose/ordered-transform-calls')
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Reject rerun or wrong branch
        run: |
          echo '::error::Use diagnosis 1 on diagnose/ordered-transform-calls, with a new run attempt of 1. Rerunning a GitHub run is disabled. A second actual diagnosis requires evaluation and a revised implementation for one strongest hypothesis.'
          exit 1

  diagnose:
    if: >-
      github.ref == 'refs/heads/diagnose/ordered-transform-calls' &&
      github.run_attempt == '1' &&
      (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[ordered-diagnostic-1]'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check initial-run request
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_RUN_NUMBER: ${{ inputs.run_number }}
          FIRST_RUN_CONFIRMED: ${{ inputs.first_run_confirmed }}
        run: |
          if [[ "$EVENT_NAME" == 'workflow_dispatch' ]]; then
            if [[ "$REQUESTED_RUN_NUMBER" != '1' || "$FIRST_RUN_CONFIRMED" != 'true' ]]; then
              echo '::error::Manual dispatch requires run_number=1 and confirmation that no earlier actual diagnostic run has executed.'
              exit 1
            fi
          fi

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download pinned published wheels
        run: |
          mkdir -p diagnostic-artifacts/wheels
          python -m pip download --only-binary=:all: --dest diagnostic-artifacts/wheels \
            'faiss-imputer==0.3.22' \
            'numpy==2.5.3' \
            'scikit-learn==1.9.1' \
            'faiss-cpu==1.15.1' 'pytest>=8' 2>&1 | tee diagnostic-artifacts/wheel-download.log
          sha256sum diagnostic-artifacts/wheels/*.whl > diagnostic-artifacts/wheel-sha256.txt

      - name: Install from captured wheels
        run: |
          python -m pip install --no-index --find-links diagnostic-artifacts/wheels \
            --only-binary=:all: --force-reinstall \
            'faiss-imputer==0.3.22' \
            'numpy==2.5.3' \
            'scikit-learn==1.9.1' \
            'faiss-cpu==1.15.1' 'pytest>=8' 2>&1 | tee diagnostic-artifacts/wheel-install.log
          python -m pip freeze --all > diagnostic-artifacts/pip-freeze.txt
          python -m pip check 2>&1 | tee diagnostic-artifacts/pip-check.txt

      - name: Record environment and installed-package provenance
        env:
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          SPEC_REVISION: validation_0.3.22_v1
          DIAGNOSTIC_RUN_NUMBER: '1'
        run: |
          python -I - <<'PY'
          import importlib.metadata as metadata
          import importlib.util
          import json
          import os
          from pathlib import Path
          import platform
          import sys

          output = Path('diagnostic-artifacts')
          output.mkdir(exist_ok=True)
          cpu_model = next(
              (line.split(':', 1)[1].strip() for line in Path('/proc/cpuinfo').read_text().splitlines()
               if line.startswith('model name')),
              None,
          )
          memory_kib = next(
              (int(line.split()[1]) for line in Path('/proc/meminfo').read_text().splitlines()
               if line.startswith('MemTotal:')),
              None,
          )
          module = importlib.util.find_spec('faiss_imputer')
          origin = str(Path(module.origin).resolve()) if module and module.origin else None
          package_versions = {
              dist.metadata['Name']: dist.version
              for dist in metadata.distributions()
              if dist.metadata.get('Name')
          }
          record = {
              'runner_image': os.environ.get('ImageOS'),
              'runner_image_version': os.environ.get('ImageVersion'),
              'runner_os': os.environ.get('RUNNER_OS'),
              'runner_arch': os.environ.get('RUNNER_ARCH'),
              'os': platform.platform(),
              'cpu_model': cpu_model,
              'logical_cpu_count': os.cpu_count(),
              'memory_bytes': memory_kib * 1024 if memory_kib is not None else None,
              'python_version': sys.version,
              'python_executable': sys.executable,
              'package_versions': dict(sorted(package_versions.items())),
              'installed_package_origin': origin,
              'wheel_sha256': (output / 'wheel-sha256.txt').read_text(),
              'workflow_sha': os.environ.get('WORKFLOW_SHA'),
              'git_sha': os.environ.get('GITHUB_SHA'),
              'github_run_id': os.environ.get('GITHUB_RUN_ID'),
              'github_run_attempt': os.environ.get('GITHUB_RUN_ATTEMPT'),
              'github_job': os.environ.get('GITHUB_JOB'),
              'github_event_name': os.environ.get('GITHUB_EVENT_NAME'),
              'github_ref': os.environ.get('GITHUB_REF'),
              'spec_revision': os.environ.get('SPEC_REVISION'),
              'diagnostic_run_number': 1,
              'threads': {name: os.environ.get(name) for name in (
                  'OMP_NUM_THREADS', 'OPENBLAS_NUM_THREADS', 'MKL_NUM_THREADS',
                  'BLIS_NUM_THREADS', 'VECLIB_MAXIMUM_THREADS', 'NUMEXPR_NUM_THREADS',
              )},
          }
          record['missing_field_reasons'] = {
              key: 'Not supplied by the runner or unavailable from this host.'
              for key, value in record.items() if value is None
          }
          (output / 'environment.json').write_text(
              json.dumps(record, indent=2) + '\n', encoding='utf-8'
          )
          expected = {
              'faiss-imputer': '0.3.22',
              'numpy': '2.5.3',
              'scikit-learn': '1.9.1',
              'faiss-cpu': '1.15.1',
          }
          for name, version in expected.items():
              if metadata.version(name) != version:
                  raise SystemExit(f'Unexpected installed version for {name}')
          if origin is None or Path(origin).is_relative_to(Path.cwd().resolve()):
              raise SystemExit('faiss_imputer must resolve outside the checked-out repository')
          PY

      - name: Check diagnostic orchestration before measurements
        run: |
          python -m pytest -q --noconftest tests/test_ordered_transform_diagnostic.py \
            2>&1 | tee diagnostic-artifacts/diagnostic-unit-tests.log

      - name: Run diagnosis 1 with nine sequential fresh workers
        run: |
          python -I benchmarks/diagnose_ordered_transform_calls.py \
            --spec benchmarks/specs/validation_0.3.22_v1.json \
            --output diagnostic-artifacts/ordered-transform-calls.json \
            2>&1 | tee diagnostic-artifacts/diagnostic-console.log

      - name: Upload inputs, source, environment, wheels and partial results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ordered-transform-diagnosis-1-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          if-no-files-found: warn
          include-hidden-files: true
          path: |
            diagnostic-artifacts/
            benchmarks/diagnose_ordered_transform_calls.py
            benchmarks/benchmark_scaling_threads.py
            benchmarks/benchmark_imputers.py
            benchmarks/specs/validation_0.3.22_v1.json
            tests/test_ordered_transform_diagnostic.py
            .github/workflows/diagnose-ordered-transform-calls.yml
