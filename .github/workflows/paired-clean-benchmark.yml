name: Paired clean branch benchmark

on:
  # Adding or updating this file on the clean branch starts the comparison.
  push:
    branches: [fix/available-batch-invariance-clean]
    paths: [.github/workflows/paired-clean-benchmark.yml]
  workflow_dispatch:
    inputs:
      main_ref:
        description: Baseline ref or SHA (defaults to main)
        type: string
        default: 'main'
      fix_ref:
        description: Candidate ref or SHA (defaults to the clean branch)
        type: string
        default: 'fix/available-batch-invariance-clean'

permissions:
  contents: read

concurrency:
  group: paired-clean-benchmark
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PAIRED_OUTPUT_DIR: ${{ github.workspace }}/paired-results
      PYTHONHASHSEED: '0'
      PYTHONPATH: ''
      PYTHONNOUSERSITE: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      BLIS_NUM_THREADS: '1'
      OMP_DYNAMIC: 'FALSE'
      MKL_DYNAMIC: 'FALSE'
    steps:
      - name: Check out baseline once
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.main_ref || 'main' }}
          path: baseline
          persist-credentials: false

      - name: Check out candidate once
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.fix_ref || github.sha }}
          path: candidate
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12.14'

      - name: Verify common harness and record exact sources
        shell: python
        run: |
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          workspace = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          out = Path(os.environ["PAIRED_OUTPUT_DIR"])
          out.mkdir(parents=True, exist_ok=True)
          sources = {"main": workspace / "baseline", "fix": workspace / "candidate"}
          manifest = {
              "workflow_sha": os.environ["GITHUB_SHA"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "order": ["main", "fix", "fix", "main"],
              "sources": {},
          }
          for label, source in sources.items():
              sha = subprocess.check_output(["git", "rev-parse", "HEAD"], cwd=source, text=True).strip()
              manifest["sources"][label] = {"sha": sha, "path": str(source)}

          shared_files = ["pyproject.toml"] + sorted(
              p.relative_to(sources["main"]).as_posix()
              for p in (sources["main"] / "benchmarks").rglob("*.py")
          )
          manifest["shared_file_sha256"] = {}
          for name in shared_files:
              baseline = (sources["main"] / name).read_bytes()
              candidate = (sources["fix"] / name).read_bytes()
              if baseline != candidate:
                  raise SystemExit(f"Refusing a mixed-harness/dependency comparison: {name} differs")
              manifest["shared_file_sha256"][name] = hashlib.sha256(baseline).hexdigest()
          if set((sources["main"] / "benchmarks").rglob("*.py")) == set():
              raise SystemExit("Missing benchmark harness")
          candidate_names = sorted(p.relative_to(sources["fix"]).as_posix()
                                   for p in (sources["fix"] / "benchmarks").rglob("*.py"))
          if candidate_names != sorted(shared_files[1:]):
              raise SystemExit("Benchmark Python file lists differ")

          for label, source in sources.items():
              manifest["sources"][label]["package_sha256"] = {
                  p.relative_to(source).as_posix(): hashlib.sha256(p.read_bytes()).hexdigest()
                  for p in sorted((source / "faiss_imputer").rglob("*.py"))
              }
          (out / "manifest.json").write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(manifest, indent=2), flush=True)

      - name: Install one shared environment
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/paired-venv"
          bench_python="$RUNNER_TEMP/paired-venv/bin/python"
          "$bench_python" -m pip install --upgrade pip
          "$bench_python" -m pip install 'numpy==2.5.2' 'scikit-learn==1.9.0' 'faiss-cpu==1.15.0'
          "$bench_python" -m pip install --no-deps ./baseline
          "$bench_python" -m pip check
          "$bench_python" -m pip freeze --all > "$PAIRED_OUTPUT_DIR/pip-freeze.txt"
          lscpu > "$PAIRED_OUTPUT_DIR/lscpu.txt"
          uname -a > "$PAIRED_OUTPUT_DIR/uname.txt"
          printf 'PAIRED_PYTHON=%s\n' "$bench_python" >> "$GITHUB_ENV"

      - name: Run main, fix, fix, main sequentially
        id: measured
        timeout-minutes: 75
        shell: python
        run: |
          import json
          import os
          import signal
          import subprocess
          import time
          from datetime import datetime, timezone
          from pathlib import Path

          out = Path(os.environ["PAIRED_OUTPUT_DIR"])
          manifest = json.loads((out / "manifest.json").read_text(encoding="utf-8"))
          python = os.environ["PAIRED_PYTHON"]
          args = [
              "-u", "-m", "benchmarks.benchmark_scaling_threads",
              "--train-sizes", "50000", "100000", "500000", "1000000",
              "--threads", "1", "2", "4", "--queries", "300", "--seeds", "101",
              "--patterns", "fixed", "random", "--repeats", "1",
              "--timeout-seconds", "180", "--budget-seconds", "900",
          ]
          # The worker runs from the same checkout as its controller. Verify imports before
          # each pass; the installed distribution only supplies common package metadata.
          probe = """
          import json
          from pathlib import Path
          import faiss_imputer
          import faiss_imputer._matrix as matrix
          import benchmarks.benchmark_scaling_threads as harness
          import benchmarks.benchmark_imputers as helper
          root = Path.cwd().resolve()
          paths = {m.__name__: str(Path(m.__file__).resolve())
                   for m in (faiss_imputer, matrix, harness, helper)}
          assert all(Path(p).is_relative_to(root) for p in paths.values()), paths
          print(json.dumps(paths))
          """
          passes = []
          for index, label in enumerate(manifest["order"], 1):
              name = f"{index:02d}-{label}"
              source = manifest["sources"][label]
              env = os.environ.copy()
              env["GITHUB_SHA"] = source["sha"]
              env["PYTHONPATH"] = ""
              started = time.monotonic()
              record = {"name": name, "label": label, "sha": source["sha"],
                        "started_at_utc": datetime.now(timezone.utc).isoformat()}
              print(f"Starting {name}: {source['sha']}", flush=True)
              try:
                  checked = subprocess.check_output(
                      [python, "-c", probe], cwd=source["path"], env=env,
                      text=True, stderr=subprocess.STDOUT, timeout=60,
                  )
                  record["imports"] = json.loads(checked)
                  command = [python, *args, "--output", str(out / f"{name}.json")]
                  with (out / f"{name}.log").open("w", encoding="utf-8") as log:
                      process = subprocess.Popen(command, cwd=source["path"], env=env,
                                                 stdout=log, stderr=subprocess.STDOUT,
                                                 start_new_session=True)
                      try:
                          record["returncode"] = process.wait(timeout=1020)
                      except subprocess.TimeoutExpired:
                          os.killpg(process.pid, signal.SIGKILL)
                          process.wait()
                          record["returncode"] = 124
                          record["error"] = "Controller exceeded 1020 seconds; process group killed"
              except (OSError, subprocess.SubprocessError, ValueError) as error:
                  record["returncode"] = 1
                  record["error"] = str(error)
                  if isinstance(error, subprocess.CalledProcessError):
                      record["probe_output"] = error.output
              record["elapsed_seconds"] = time.monotonic() - started
              record["finished_at_utc"] = datetime.now(timezone.utc).isoformat()
              passes.append(record)
              (out / "passes.json").write_text(json.dumps(passes, indent=2) + "\n", encoding="utf-8")
              print(f"Finished {name}: exit={record['returncode']}", flush=True)
          raise SystemExit(int(any(p["returncode"] for p in passes)))

      - name: Validate matched results and write comparison
        if: always() && steps.measured.outcome != 'skipped'
        shell: python
        run: |
          import csv
          import itertools
          import json
          import math
          import os
          from pathlib import Path

          OUT = Path(os.environ["PAIRED_OUTPUT_DIR"])
          OUT.mkdir(parents=True, exist_ok=True)
          PASSES = ("01-main", "02-fix", "03-fix", "04-main")
          METHODS = ("KNNImputer", "FaissImputer[complete]", "FaissImputer[available]")
          KEYS = ("size", "seed", "pattern", "repeat", "threads", "method")
          METRICS = ("fit_seconds", "transform_seconds", "total_seconds", "worker_peak_rss_mib")
          META = ("cpu_model", "platform", "python", "numpy", "scikit_learn", "faiss",
                  "logical_cpus", "affinity_cpus")
          STATS = (*PASSES, "main_mean", "fix_mean", "delta_percent",
                   "main_spread_percent", "fix_spread_percent")
          global_errors, diagnostics, documents = [], [], []


          def read_json(path):
              try:
                  value = json.loads(path.read_text(encoding="utf-8"))
                  json.dumps(value, allow_nan=False)
                  if not isinstance(value, dict):
                      raise ValueError("top level must be an object")
                  return value
              except (OSError, ValueError) as error:
                  global_errors.append(f"{path.name}: {error}")
                  return {}


          for name in PASSES:
              documents.append(read_json(OUT / f"{name}.json"))
          manifest = read_json(OUT / "manifest.json") if (OUT / "manifest.json").exists() else None
          pass_results = None
          if (OUT / "passes.json").exists():
              try:
                  pass_results = json.loads((OUT / "passes.json").read_text(encoding="utf-8"))
                  json.dumps(pass_results, allow_nan=False)
                  if not isinstance(pass_results, list) or len(pass_results) != 4:
                      raise ValueError("expected four pass entries")
                  for index, result in enumerate(pass_results):
                      label = "main" if index in (0, 3) else "fix"
                      if type(result.get("returncode")) is not int or (result.get("name"), result.get("label"), result.get("returncode")) != (PASSES[index], label, 0):
                          raise ValueError(f"incorrect order, label, or failed controller at pass {index + 1}")
              except (OSError, ValueError, AttributeError) as error:
                  global_errors.append(f"passes.json: {error}")
          parameters = next((d["parameters"] for d in documents
                             if isinstance(d.get("parameters"), dict)), {})
          expected = []
          try:
              dimensions = [parameters[k] for k in ("train_sizes", "seeds", "patterns")]
              dimensions += [range(1, parameters["repeats"] + 1), parameters["threads"], METHODS]
              expected = list(itertools.product(*dimensions))
              if not expected or len(set(expected)) != len(expected):
                  raise ValueError("empty or duplicated configuration dimensions")
              if not isinstance(parameters["queries"], int) or parameters["queries"] < 1:
                  raise ValueError("queries must be a positive integer")
          except (KeyError, TypeError, ValueError) as error:
              global_errors.append(f"Invalid benchmark parameters: {error}")
              expected = []
          expected_set = set(expected)
          baseline_metadata = documents[0].get("metadata", {})
          if not isinstance(baseline_metadata, dict):
              baseline_metadata = {}
          record_maps, duplicates, all_metadata = [], [], []
          for pass_index, (name, document) in enumerate(zip(PASSES, documents)):
              if document.get("parameters") != parameters:
                  global_errors.append(f"{name}: parameters differ or are missing")
              metadata = document.get("metadata", {})
              if not isinstance(metadata, dict):
                  metadata = {}
              all_metadata.append(metadata)
              for field in META:
                  if field not in metadata or field not in baseline_metadata:
                      global_errors.append(f"{name}: metadata field {field} is missing")
                  elif metadata[field] != baseline_metadata[field]:
                      global_errors.append(f"{name}: metadata field {field} differs from 01-main")
              if not isinstance(metadata.get("git_commit"), str) or not metadata["git_commit"]:
                  global_errors.append(f"{name}: git_commit is missing")
              label = "main" if pass_index in (0, 3) else "fix"
              if manifest is not None:
                  try:
                      if manifest["order"] != ["main", "fix", "fix", "main"] or metadata.get("git_commit") != manifest["sources"][label]["sha"]:
                          raise ValueError("manifest order or source SHA mismatch")
                  except (KeyError, TypeError, ValueError) as error:
                      global_errors.append(f"{name}: {error}")
              if isinstance(pass_results, list) and len(pass_results) == 4:
                  if not isinstance(pass_results[pass_index], dict) or pass_results[pass_index].get("sha") != metadata.get("git_commit"):
                      global_errors.append(f"{name}: passes.json SHA differs from recorded git_commit")
              mapping, repeated = {}, set()
              records = document.get("records", [])
              if not isinstance(records, list):
                  global_errors.append(f"{name}: records must be a list")
                  records = []
              for index, record in enumerate(records):
                  try:
                      key = tuple(record[k] for k in KEYS)
                      if key not in expected_set:
                          global_errors.append(f"{name}: unexpected configuration at record {index}: {key}")
                          continue
                      if key in mapping:
                          repeated.add(key)
                      else:
                          mapping[key] = record
                  except (KeyError, TypeError) as error:
                      global_errors.append(f"{name}: malformed record {index}: {error}")
              record_maps.append(mapping)
              duplicates.append(repeated)
          for a, b in ((0, 3), (1, 2)):
              if all_metadata[a].get("git_commit") != all_metadata[b].get("git_commit"):
                  global_errors.append(f"Commit mismatch: {PASSES[a]} and {PASSES[b]}")


          def positive_number(value):
              return isinstance(value, (int, float)) and not isinstance(value, bool) and math.isfinite(value) and value > 0


          def statistics(values, valid):
              result = dict(zip(PASSES, values))
              result.update({name: None for name in STATS[4:]})
              if valid:
                  main, fix = math.fsum((values[0], values[3])) / 2, math.fsum(values[1:3]) / 2
                  result.update(main_mean=main, fix_mean=fix, delta_percent=100 * (fix / main - 1),
                                main_spread_percent=100 * abs(values[3] - values[0]) / main,
                                fix_spread_percent=100 * abs(values[2] - values[1]) / fix)
              return result


          rows = []
          for key in expected:
              errors, records = [], [mapping.get(key) for mapping in record_maps]
              for index, (name, record) in enumerate(zip(PASSES, records)):
                  if record is None:
                      errors.append(f"{name}: missing configuration")
                      continue
                  if key in duplicates[index]:
                      errors.append(f"{name}: duplicate configuration")
                  if record.get("status") != "ok" or record.get("checks_passed") is not True:
                      errors.append(f"{name}: status={record.get('status')}, checks_passed={record.get('checks_passed')}")
                  if record.get("queries") != parameters.get("queries") or record.get("prefix_sizes") != parameters.get("train_sizes"):
                      errors.append(f"{name}: query count or prefix sizes differ from parameters")
                  for field in ("fingerprints", "threadpools", "faiss_omp_threads"):
                      if field not in record or not record[field]:
                          errors.append(f"{name}: {field} is missing or empty")
                      elif records[0] is not None and record[field] != records[0].get(field):
                          errors.append(f"{name}: {field} differs from 01-main")
                  if record.get("faiss_omp_threads") != key[4]:
                      errors.append(f"{name}: FAISS thread count differs from requested threads")
                  for metric in METRICS:
                      if not positive_number(record.get(metric)):
                          errors.append(f"{name}: invalid or unavailable {metric}")
              valid = not errors and not global_errors
              metrics = {metric: statistics([r.get(metric) if r else None for r in records], valid)
                         for metric in METRICS}
              rows.append({"config": dict(zip(KEYS, key)), "valid": valid, "diagnostics": errors, "metrics": metrics})
              diagnostics.extend(f"{dict(zip(KEYS, key))}: {error}" for error in errors)
          diagnostics = global_errors + diagnostics
          comparison = {"valid": bool(rows) and not diagnostics, "pass_order": PASSES,
                        "parameters": parameters, "metadata": [d.get("metadata") for d in documents],
                        "manifest": manifest, "pass_results": pass_results, "global_diagnostics": global_errors,
                        "diagnostics": diagnostics, "rows": rows}
          (OUT / "comparison.json").write_text(json.dumps(comparison, indent=2, allow_nan=False) + "\n", encoding="utf-8")
          columns = [*KEYS, "valid", "diagnostics", *(f"{m}_{s}" for m in METRICS for s in STATS)]
          with (OUT / "comparison.csv").open("w", newline="", encoding="utf-8") as handle:
              writer = csv.DictWriter(handle, fieldnames=columns)
              writer.writeheader()
              for row in rows:
                  flat = {**row["config"], "valid": row["valid"], "diagnostics": " | ".join(global_errors + row["diagnostics"])}
                  flat.update({f"{m}_{s}": row["metrics"][m][s] for m in METRICS for s in STATS})
                  writer.writerow(flat)


          def fmt(value, signed=False):
              return "invalid" if value is None else (f"{value:+.2f}" if signed else f"{value:.4f}")


          summary = ["# Same-runner paired benchmark", "",
                     f"Validation: {'PASS' if comparison['valid'] else 'FAIL'}; {sum(r['valid'] for r in rows)}/{len(rows)} configurations valid.", "",
                     "Order: main 1, fix 1, fix 2, main 2. Every reported mean uses both runs of its version.", "",
                     "Delta = 100 × (fix mean / main mean − 1); positive means slower. Spread = 100 × (maximum − minimum) / mean within a version.", "",
                     "Two observations per version are a pilot. ABBA reduces order bias but does not eliminate variable runner load or establish statistical significance. No KNN normalization or aggregate slowdown is applied.", "",
                     "Raw fit, transform, total seconds and full-worker lifetime peak RSS (MiB) are in comparison.csv and comparison.json. Invalid configurations have no derived statistics.", ""]
          for title, methods in (("Available transform time", (METHODS[2],)), ("Control transform times", METHODS[:2])):
              summary += [f"## {title}", "", "| Method | Rows / pattern / threads / seed / repeat | Main mean (s) | Fix mean (s) | Delta (%) | Main spread (%) | Fix spread (%) |",
                          "|---|---|---:|---:|---:|---:|---:|"]
              for row in rows:
                  c, metric = row["config"], row["metrics"]["transform_seconds"]
                  if c["method"] in methods:
                      label = " / ".join(str(c[k]) for k in ("size", "pattern", "threads", "seed", "repeat"))
                      summary.append(f"| {c['method']} | {label} | {fmt(metric['main_mean'])} | {fmt(metric['fix_mean'])} | {fmt(metric['delta_percent'], True)} | {fmt(metric['main_spread_percent'])} | {fmt(metric['fix_spread_percent'])} |")
              summary.append("")
          if diagnostics:
              summary += ["## Diagnostics", "", f"{len(diagnostics)} issue(s); full details are in comparison.json.", ""]
              summary += [f"- {error}" for error in diagnostics[:30]]
          summary_text = "\n".join(summary) + "\n"
          (OUT / "summary.md").write_text(summary_text, encoding="utf-8")
          if os.environ.get("GITHUB_STEP_SUMMARY"):
              with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as handle:
                  handle.write(summary_text + "\n")
          print(f"Paired comparison: {'PASS' if comparison['valid'] else 'FAIL'}; outputs in {OUT}")
          raise SystemExit(0 if comparison["valid"] else 1)

      - name: Upload raw measurements and comparison
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: paired-clean-benchmark-${{ github.run_id }}-${{ github.run_attempt }}
          path: paired-results/
          if-no-files-found: error
          retention-days: 14
