name: Analyze released-version benchmark results

on:
  workflow_dispatch:
  push:
    branches:
      - "bench/released-0.3.22"
      - "bench/released-wine-quality-0.3.22"
      - "bench/released-abalone-results-0.3.22"
    paths:
      - ".github/workflows/analyze-released-versions.yml"
      - "benchmarks/analyze_released_versions.py"
      - "benchmarks/analyze_released_real_data.py"
      - "tests/test_released_real_data_analysis.py"
      - "benchmarks/results/released_versions_0.3.21.zip"
      - "benchmarks/results/released_versions_0.3.21-summary.json"
      - "docs/benchmarks/released_versions_0.3.21.md"
      - "benchmarks/results/released_versions_0.3.22.zip"
      - "benchmarks/results/released_versions_0.3.22-summary.json"
      - "docs/benchmarks/released_versions_0.3.22.md"
      - "benchmarks/results/released_wine_quality_0.3.22.zip"
      - "benchmarks/results/released_wine_quality_0.3.22-summary.json"
      - "docs/benchmarks/released_wine_quality_0.3.22.md"
      - "benchmarks/results/released_abalone_0.3.22.zip"
      - "benchmarks/results/released_abalone_0.3.22-summary.json"
      - "docs/benchmarks/released_abalone_0.3.22.md"
  pull_request:
    paths:
      - ".github/workflows/analyze-released-versions.yml"
      - "benchmarks/analyze_released_versions.py"
      - "benchmarks/analyze_released_real_data.py"
      - "tests/test_released_real_data_analysis.py"
      - "benchmarks/results/released_versions_0.3.21.zip"
      - "benchmarks/results/released_versions_0.3.21-summary.json"
      - "docs/benchmarks/released_versions_0.3.21.md"
      - "benchmarks/results/released_versions_0.3.22.zip"
      - "benchmarks/results/released_versions_0.3.22-summary.json"
      - "docs/benchmarks/released_versions_0.3.22.md"
      - "benchmarks/results/released_wine_quality_0.3.22.zip"
      - "benchmarks/results/released_wine_quality_0.3.22-summary.json"
      - "docs/benchmarks/released_wine_quality_0.3.22.md"
      - "benchmarks/results/released_abalone_0.3.22.zip"
      - "benchmarks/results/released_abalone_0.3.22-summary.json"
      - "docs/benchmarks/released_abalone_0.3.22.md"

permissions:
  contents: read

jobs:
  analyze:
    name: Regenerate and verify ${{ matrix.id }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: released-0.3.21
            release: "0.3.21"
            generator: benchmarks/analyze_released_versions.py
            stem: released_versions_0.3.21
          - id: released-0.3.22
            release: "0.3.22"
            generator: benchmarks/analyze_released_versions.py
            stem: released_versions_0.3.22
          - id: released-wine-quality-0.3.22
            release: "0.3.22"
            generator: benchmarks/analyze_released_real_data.py
            stem: released_wine_quality_0.3.22
          - id: released-abalone-0.3.22
            release: "0.3.22"
            generator: benchmarks/analyze_released_real_data.py
            dataset: abalone
            stem: released_abalone_0.3.22
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Regenerate report and summary
        env:
          RELEASE: ${{ matrix.release }}
          GENERATOR: ${{ matrix.generator }}
          DATASET: ${{ matrix.dataset }}
          STEM: ${{ matrix.stem }}
        run: |
          dataset_args=()
          if [[ -n "$DATASET" ]]; then
            dataset_args=(--dataset "$DATASET")
          fi
          python "$GENERATOR" "${dataset_args[@]}" \
            --release "$RELEASE" \
            --report "benchmark_outputs/${STEM}.md" \
            --summary "benchmark_outputs/${STEM}-summary.json"

      - name: Compare with committed outputs
        env:
          PROFILE_ID: ${{ matrix.id }}
          STEM: ${{ matrix.stem }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          report="docs/benchmarks/${STEM}.md"
          summary="benchmarks/results/${STEM}-summary.json"
          if [[ -f "$report" && -f "$summary" ]]; then
            diff -u "$report" "benchmark_outputs/${STEM}.md"
            diff -u "$summary" "benchmark_outputs/${STEM}-summary.json"
          elif [[ -e "$report" || -e "$summary" ]]; then
            echo "::error::Both committed outputs must be present together for ${PROFILE_ID}."
            exit 1
          elif [[ "$PROFILE_ID" == "released-0.3.22" &&
                  ( "$EVENT_NAME" == "workflow_dispatch" || "$EVENT_NAME" == "push" ) ]]; then
            echo "::notice::Generation only: the first 0.3.22 report and summary are not committed yet. Commit both outputs, then rerun or open a pull request to verify them before merging."
          elif [[ "$PROFILE_ID" == "released-wine-quality-0.3.22" &&
                  "$REF_NAME" == "bench/released-wine-quality-0.3.22" &&
                  ( "$EVENT_NAME" == "workflow_dispatch" || "$EVENT_NAME" == "push" ) ]]; then
            echo "::notice::Generation only: the first Wine Quality report and summary are not committed yet. Commit both outputs together on this branch before opening a pull request."
          elif [[ "$PROFILE_ID" == "released-abalone-0.3.22" &&
                  "$REF_NAME" == "bench/released-abalone-results-0.3.22" &&
                  ( "$EVENT_NAME" == "workflow_dispatch" || "$EVENT_NAME" == "push" ) ]]; then
            echo "::notice::Generation only: the first Abalone report and summary are not committed yet. Commit both outputs together on this branch before opening a pull request."
          else
            echo "::error::Committed report and summary are required for ${PROFILE_ID}."
            exit 1
          fi

      - name: Upload regenerated analysis
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.id }}-analysis-${{ github.run_id }}-${{ github.run_attempt }}
          path: benchmark_outputs/
          if-no-files-found: error
          retention-days: 30
