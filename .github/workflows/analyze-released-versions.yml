name: Analyze released-version benchmark results

on:
  workflow_dispatch:
  push:
    branches:
      - "bench/released-0.3.22"
    paths:
      - ".github/workflows/analyze-released-versions.yml"
      - "benchmarks/analyze_released_versions.py"
      - "benchmarks/results/released_versions_0.3.21.zip"
      - "benchmarks/results/released_versions_0.3.21-summary.json"
      - "docs/benchmarks/released_versions_0.3.21.md"
      - "benchmarks/results/released_versions_0.3.22.zip"
      - "benchmarks/results/released_versions_0.3.22-summary.json"
      - "docs/benchmarks/released_versions_0.3.22.md"
  pull_request:
    paths:
      - ".github/workflows/analyze-released-versions.yml"
      - "benchmarks/analyze_released_versions.py"
      - "benchmarks/results/released_versions_0.3.21.zip"
      - "benchmarks/results/released_versions_0.3.21-summary.json"
      - "docs/benchmarks/released_versions_0.3.21.md"
      - "benchmarks/results/released_versions_0.3.22.zip"
      - "benchmarks/results/released_versions_0.3.22-summary.json"
      - "docs/benchmarks/released_versions_0.3.22.md"

permissions:
  contents: read

jobs:
  analyze:
    name: Regenerate and verify release ${{ matrix.release }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        release: ["0.3.21", "0.3.22"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Regenerate report and summary
        env:
          RELEASE: ${{ matrix.release }}
        run: |
          python benchmarks/analyze_released_versions.py \
            --release "$RELEASE" \
            --report "benchmark_outputs/released_versions_${RELEASE}.md" \
            --summary "benchmark_outputs/released_versions_${RELEASE}-summary.json"

      - name: Compare with committed outputs
        env:
          RELEASE: ${{ matrix.release }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          report="docs/benchmarks/released_versions_${RELEASE}.md"
          summary="benchmarks/results/released_versions_${RELEASE}-summary.json"
          if [[ -f "$report" && -f "$summary" ]]; then
            diff -u "$report" "benchmark_outputs/released_versions_${RELEASE}.md"
            diff -u "$summary" "benchmark_outputs/released_versions_${RELEASE}-summary.json"
          elif [[ -e "$report" || -e "$summary" ]]; then
            echo "::error::Both committed outputs must be present together for release ${RELEASE}."
            exit 1
          elif [[ "$RELEASE" == "0.3.22" &&
                  ( "$EVENT_NAME" == "workflow_dispatch" || "$EVENT_NAME" == "push" ) ]]; then
            echo "::notice::Generation only: the first 0.3.22 report and summary are not committed yet. Commit both outputs, then rerun or open a pull request to verify them before merging."
          else
            echo "::error::Committed report and summary are required for release ${RELEASE}."
            exit 1
          fi

      - name: Upload regenerated analysis
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: released-${{ matrix.release }}-analysis-${{ github.run_id }}-${{ github.run_attempt }}
          path: benchmark_outputs/
          if-no-files-found: error
          retention-days: 30