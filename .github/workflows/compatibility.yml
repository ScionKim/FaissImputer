name: Compatibility

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compatibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python }} / ${{ matrix.dependencies }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.10"
            dependencies: minimum
          - python: "3.10"
            dependencies: latest
          - python: "3.14"
            dependencies: latest

    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install minimum dependencies
        if: matrix.dependencies == 'minimum'
        run: |
          python -m pip install -e ".[test]" \
            "numpy==1.24.0" \
            "faiss-cpu==1.7.4" \
            "scikit-learn==1.6.0"

      - name: Install latest compatible dependencies
        if: matrix.dependencies == 'latest'
        run: python -m pip install --upgrade --upgrade-strategy eager -e ".[test]"

      - name: Check installed environment
        run: |
          python --version
          python -m pip check
          python -m pip list
          python -c "import numpy, faiss, sklearn; print(numpy.__version__, faiss.__version__, sklearn.__version__)"

      - name: Run all tests
        run: python -m pytest -q
