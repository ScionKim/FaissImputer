name: Same-data fit-transform benchmark

on:
  workflow_dispatch:
    inputs:
      phase_memory:
      description: "Measure phase-separated memory (retained fitted memory and fit/transform peak RSS); timings from this run are for reference only"
      type: boolean
      default: false
    sizes:
      description: "Training sizes, space-separated (e.g. '1000 3000 10000')"
      type: string
      default: "1000 3000 10000 20000"
    features:
      description: "Feature count"
      type: number
      default: 20
    neighbors:
      description: "Neighbor count"
      type: number
      default: 5
    missing_rate:
      description: "Target missing rate between 0 and 1"
      type: number
      default: 0.10
    missing_pattern:
      description: "Missingness pattern"
      type: choice
      options:
        - mcar
        - mar
      default: mcar
    repeats:
      description: "Repeats per case"
      type: number
      default: 3

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 105

    defaults:
      run:
        shell: bash

    env:
      PYTHONNOUSERSITE: "1"
      PYTHONHASHSEED: "0"
      PYTHONPATH: ""
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      BLIS_NUM_THREADS: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - name: Check out benchmark source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Initialize paths
        run: |
          {
            echo "BUILD_ENV=$RUNNER_TEMP/fit-transform-build-env"
            echo "BUILD_DIR=$RUNNER_TEMP/fit-transform-source"
            echo "BENCHMARK_ENV=$RUNNER_TEMP/fit-transform-runtime"
            echo "BENCHMARK_DIR=$RUNNER_TEMP/fit-transform-benchmark"
            echo "OUTPUT_DIR=$GITHUB_WORKSPACE/benchmark_outputs"
          } >> "$GITHUB_ENV"

          mkdir -p "$GITHUB_WORKSPACE/benchmark_outputs/wheels"

      - name: Build candidate wheel and record provenance
        run: |
          python -m venv "$BUILD_ENV"
          "$BUILD_ENV/bin/python" -m pip install \
            "build>=1.2" "packaging>=24"

          mkdir -p "$BUILD_DIR"
          git archive HEAD | tar -x -C "$BUILD_DIR"

          "$BUILD_ENV/bin/python" - <<'PY'
          import hashlib
          import json
          import os
          import re
          import subprocess
          import sys
          import tomllib
          from pathlib import Path

          from packaging.version import Version

          workspace = Path(os.environ["GITHUB_WORKSPACE"])
          build_dir = Path(os.environ["BUILD_DIR"])
          output_dir = Path(os.environ["OUTPUT_DIR"])
          wheel_dir = output_dir / "wheels"

          source_commit = subprocess.check_output(
              ["git", "rev-parse", "HEAD"],
              cwd=workspace,
              text=True,
          ).strip()

          if source_commit != os.environ["GITHUB_SHA"]:
              raise RuntimeError("Checkout commit differs from GITHUB_SHA")

          project_path = build_dir / "pyproject.toml"
          source = project_path.read_text(encoding="utf-8")
          declared_version = tomllib.loads(source)["project"]["version"]
          candidate_version = (
              f"{Version(declared_version).public}"
              f"+bench.{source_commit[:12]}"
          )

          lines = source.splitlines(keepends=True)
          in_project = False
          replacements = 0

          for position, line in enumerate(lines):
              stripped = line.strip()
              if stripped.startswith("["):
                  section = stripped.split("#", 1)[0].strip()
                  in_project = section == "[project]"
              elif in_project and re.match(r"^\s*version\s*=", line):
                  lines[position] = f'version = "{candidate_version}"\n'
                  replacements += 1

          if replacements != 1:
              raise RuntimeError(
                  "Expected exactly one static version in [project]"
              )

          project_path.write_text("".join(lines), encoding="utf-8")

          subprocess.run(
              [
                  sys.executable,
                  "-m",
                  "build",
                  "--wheel",
                  "--outdir",
                  str(wheel_dir),
                  str(build_dir),
              ],
              check=True,
          )

          wheels = list(wheel_dir.glob("*.whl"))
          if len(wheels) != 1:
              raise RuntimeError("Expected exactly one candidate wheel")

          wheel = wheels[0]
          provenance = {
              "version": candidate_version,
              "declared_version": declared_version,
              "source_commit": source_commit,
              "wheel_filename": wheel.name,
              "wheel_sha256": hashlib.sha256(wheel.read_bytes()).hexdigest(),
              "github_run_id": os.environ["GITHUB_RUN_ID"],
              "github_run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
          }

          (output_dir / "candidate-build.json").write_text(
              json.dumps(provenance, indent=2) + "\n",
              encoding="utf-8",
          )

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as stream:
              stream.write(f"CANDIDATE_VERSION={candidate_version}\n")
              stream.write(f"CANDIDATE_WHEEL={wheel}\n")

          print(f"Candidate: {candidate_version}")
          print(f"Source commit: {source_commit}")
          print(f"Wheel SHA256: {provenance['wheel_sha256']}")
          PY

      - name: Install candidate in an isolated environment
        run: |
          python -m venv "$BENCHMARK_ENV"

          "$BENCHMARK_ENV/bin/python" -m pip install \
            --only-binary=:all: \
            --report "$OUTPUT_DIR/install-report.json" \
            "$CANDIDATE_WHEEL"

          "$BENCHMARK_ENV/bin/python" -m pip freeze \
            > "$OUTPUT_DIR/runtime-requirements.txt"

          "$BUILD_ENV/bin/python" -m pip freeze \
            > "$OUTPUT_DIR/build-requirements.txt"

      - name: Copy benchmark code outside the checkout
        run: |
          mkdir -p "$BENCHMARK_DIR"
          cp -R "$GITHUB_WORKSPACE/benchmarks" "$BENCHMARK_DIR/benchmarks"

      - name: Run same-data comparison
        env:
          BENCH_SIZES: ${{ inputs.sizes }}
        run: |
          unset PYTHONPATH
          cd "$BENCHMARK_DIR"

          read -ra SIZES <<< "$BENCH_SIZES"

          PHASE_MEMORY_FLAG=()
          if [ "${{ inputs.phase_memory }}" = "true" ]; then
            PHASE_MEMORY_FLAG=(--phase-memory)
          fi

          "$BENCHMARK_ENV/bin/python" -u \
            -m benchmarks.benchmark_fit_transform \
            --expected-version "$CANDIDATE_VERSION" \
            --provenance "$OUTPUT_DIR/candidate-build.json" \
            --sizes "${SIZES[@]}" \
            --seeds 101 202 303 \
            --repeats "${{ inputs.repeats }}" \
            --features "${{ inputs.features }}" \
            --neighbors "${{ inputs.neighbors }}" \
            --missing-rate "${{ inputs.missing_rate }}" \
            --missing-pattern "${{ inputs.missing_pattern }}" \
            --timeout-seconds 300 \
            --budget-seconds 5400 \
            "${PHASE_MEMORY_FLAG[@]}" \
            --output "$OUTPUT_DIR/fit_transform.json"


      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fit-transform-${{ github.run_id }}-${{ github.run_attempt }}
          path: benchmark_outputs/
          if-no-files-found: warn
          retention-days: 30