name: Scaling and thread benchmark

on:
  push:
    branches:
      - bench/released-scaling
    paths:
      - .github/workflows/scaling-threads-benchmark.yml
      - benchmarks/benchmark_scaling_threads.py
      - benchmarks/benchmark_imputers.py
  workflow_dispatch:
    inputs:
      release_version:
        description: FaissImputer release version to install from PyPI
        required: true
        default: "0.3.10"
        type: string

permissions:
  contents: read

concurrency:
  group: scaling-threads-${{ github.ref }}
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    env:
      RELEASE_VERSION: ${{ inputs.release_version || '0.3.10' }}
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      BLIS_NUM_THREADS: "1"
      OMP_DYNAMIC: "FALSE"
      MKL_DYNAMIC: "FALSE"
      PYTHONNOUSERSITE: "1"
      PYTHONPATH: ""

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install released package
        shell: bash
        run: |
          set -euo pipefail
          venv_dir="$RUNNER_TEMP/scaling-benchmark-venv"
          output_dir="$RUNNER_TEMP/scaling-benchmark-results"

          mkdir -p "$output_dir"
          python -m venv "$venv_dir"
          "$venv_dir/bin/python" -m pip install \
            --only-binary=:all: "faiss-imputer==$RELEASE_VERSION"
          "$venv_dir/bin/python" -m pip check
          "$venv_dir/bin/python" -m pip freeze \
            > "$output_dir/requirements.txt"

      - name: Prepare benchmark outside the source checkout
        shell: bash
        run: |
          set -euo pipefail
          run_dir="$RUNNER_TEMP/scaling-benchmark-run"
          output_dir="$RUNNER_TEMP/scaling-benchmark-results"

          mkdir -p "$run_dir" "$output_dir/harness"
          cp -R benchmarks "$run_dir/benchmarks"
          cp -R benchmarks "$output_dir/harness/benchmarks"
          cp .github/workflows/scaling-threads-benchmark.yml \
            "$output_dir/workflow.yml"

      - name: Run released-package comparison
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/scaling-benchmark-run"

          "$RUNNER_TEMP/scaling-benchmark-venv/bin/python" \
            -u -m benchmarks.benchmark_scaling_threads \
            --expected-version "$RELEASE_VERSION" \
            --policy-matched-data \
            --train-sizes 1000 5000 20000 100000 \
            --threads 1 \
            --queries 300 \
            --seeds 11 23 37 \
            --patterns fixed random \
            --repeats 3 \
            --repeated-transforms 3 \
            --timeout-seconds 180 \
            --budget-seconds 1800 \
            --output "$RUNNER_TEMP/scaling-benchmark-results/scaling_threads.json"

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: scaling-threads-benchmark-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/scaling-benchmark-results/
          if-no-files-found: error
          retention-days: 30
