name: Scaling and thread benchmark

on:
  push:
    branches: [bench/scaling-threads]
    paths:
      - .github/workflows/scaling-threads-benchmark.yml
      - benchmarks/benchmark_scaling_threads.py
      - benchmarks/benchmark_imputers.py
      - faiss_imputer/**
      - pyproject.toml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scaling-threads-${{ github.ref }}
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      BLIS_NUM_THREADS: "1"
      OMP_DYNAMIC: "FALSE"
      MKL_DYNAMIC: "FALSE"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "."
          python -m pip check

      - name: Run scaling pilot
        run: >-
          python -u -m benchmarks.benchmark_scaling_threads
          --train-sizes 50000 100000 500000 1000000
          --threads 1 2 4
          --queries 300
          --seeds 101
          --patterns fixed random
          --repeats 1
          --timeout-seconds 180
          --budget-seconds 900
          --output benchmark_outputs/scaling_threads.json

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: scaling-threads-benchmark
          path: benchmark_outputs/scaling_threads.json
          if-no-files-found: error
          retention-days: 14
