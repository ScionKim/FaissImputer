name: Real-data output diagnostic
run-name: "${{ inputs.diagnostic || 'wine_quality_float32' }} diagnostic (${{ github.ref_name }})"

on:
  workflow_dispatch:
    inputs:
      diagnostic:
        description: Case to diagnose (wine_released_* and abalone_released_* use PyPI 0.3.22)
        required: true
        type: choice
        default: wine_quality_float32
        options:
          - wine_quality_float32
          - abalone_float64
          - california_float32
          - abalone_released_float32
          - abalone_released_float64
          - abalone_released_distance_float32
          - abalone_released_distance_float64
          - wine_released_uniform_float32_seed101
          - wine_released_distance_float32_seed101
          - wine_released_distance_float32_seed202
          - wine_released_distance_float32_seed303

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    defaults:
      run:
        shell: bash

    env:
      DIAG_CASE: ${{ inputs.diagnostic || 'wine_quality_float32' }}
      PYTHONNOUSERSITE: "1"
      PYTHONHASHSEED: "0"
      PYTHONPATH: ""
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      BLIS_NUM_THREADS: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - name: Check out diagnostic source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check out the original benchmark library source
        if: env.DIAG_CASE == 'abalone_float64' || env.DIAG_CASE == 'wine_quality_float32'
        uses: actions/checkout@v7
        with:
          ref: ef04b1b0274d3abdd977440dd61e7d91e328c64d
          path: _diagnostic_library_source
          persist-credentials: false

      - name: Set up the recorded Python version
        uses: actions/setup-python@v7
        with:
          python-version: "3.12.14"

      - name: Initialize paths and selected case
        run: |
          source_dir="$GITHUB_WORKSPACE/_diagnostic_library_source"
          source_commit="ef04b1b0274d3abdd977440dd61e7d91e328c64d"
          evidence="$GITHUB_WORKSPACE/benchmarks/results/real-data-datasets-ef04b1b"
          released_case=""
          baseline_member=""
          baseline_sha256=""
          dataset_sha256="755a6a67c5b266961a3f149ea13be2cfb6e6c727e48cee3c83bc0b4526210ee4"
          max_rows="20"
          released_archive="$GITHUB_WORKSPACE/benchmarks/results/released_abalone_0.3.22.zip"
          released_archive_sha256="8d2e491b9f066312627e5ea8ad6b955269c1634e7ae059b71d1aecac8579b638"
          provenance="$GITHUB_WORKSPACE/diagnostic_outputs/candidate-build.json"

          case "$DIAG_CASE" in
            wine_quality_float32)
              module="benchmarks.diagnose_wine_quality_output"
              output_name="wine_quality_output_diagnostic.json"
              dataset_id="wine_quality_white"
              baseline="$evidence/wine-quality-white.json"
              archive_name="wine_quality_white.zip"
              ;;
            abalone_float64)
              module="benchmarks.diagnose_abalone_output"
              output_name="abalone_output_diagnostic.json"
              dataset_id="abalone"
              baseline="$evidence/abalone.json"
              archive_name="abalone.zip"
              ;;
            california_float32)
              source_dir="$GITHUB_WORKSPACE"
              source_commit="$GITHUB_SHA"
              module="benchmarks.diagnose_real_data_float32"
              output_name="real_data_float32_diagnostic.json"
              dataset_id="california_housing"
              baseline="$GITHUB_WORKSPACE/benchmarks/results/real-data-coverage-8f289647.json"
              archive_name=""
              ;;
            abalone_released_float32|abalone_released_float64)
              source_dir=""
              source_commit=""
              dtype="${DIAG_CASE#abalone_released_}"
              released_case="released_$dtype"
              module="benchmarks.diagnose_abalone_output"
              output_name="abalone_released_0.3.22_${dtype}_diagnostic.json"
              dataset_id="abalone"
              baseline="$GITHUB_WORKSPACE/diagnostic_outputs/reference-benchmark.json"
              archive_name="abalone.zip"
              baseline_member="version_comparison_abalone_${dtype}.json"
              provenance="$GITHUB_WORKSPACE/diagnostic_outputs/published-wheel.json"
              if [[ "$dtype" == "float32" ]]; then
                baseline_sha256="50d92bbc54652408795939f377f862a191a1a4919bd27418e3caf9f76b347bea"
              else
                baseline_sha256="d4e5814a2fd5b773f0d268e940fddeccc67fdf0e459edd2dc678a43a94d089ef"
              fi
              echo "DIAG_EXPECTED_VERSION=0.3.22" >> "$GITHUB_ENV"
              ;;
            abalone_released_distance_float32|abalone_released_distance_float64)
              source_dir=""
              source_commit=""
              dtype="${DIAG_CASE#abalone_released_distance_}"
              max_rows="100"
              released_case="released_distance_$dtype"
              module="benchmarks.diagnose_abalone_output"
              output_name="abalone_released_0.3.22_distance_${dtype}_diagnostic.json"
              dataset_id="abalone"
              baseline="$GITHUB_WORKSPACE/diagnostic_outputs/reference-benchmark.json"
              archive_name="abalone.zip"
              baseline_member="version_comparison_abalone_${dtype}_distance.json"
              provenance="$GITHUB_WORKSPACE/diagnostic_outputs/published-wheel.json"
              released_archive="$GITHUB_WORKSPACE/benchmarks/results/released_abalone_distance_0.3.22.zip"
              released_archive_sha256="c9239069766885e67b3c11c8f56d4a6268f9d1c9b1d27c431ea56d35f6dca3c0"
              if [[ "$dtype" == "float32" ]]; then
                baseline_sha256="41297a57f6d7a101527f731efb9c6571f90b706da810e5ec3f2d42af590959d5"
              else
                baseline_sha256="c908b062021185483b6f72551d264c96c77290a97bebed93144bbda7c8f87a7f"
              fi
              echo "DIAG_EXPECTED_VERSION=0.3.22" >> "$GITHUB_ENV"
              ;;
            wine_released_uniform_float32_seed101|wine_released_distance_float32_seed101|wine_released_distance_float32_seed202|wine_released_distance_float32_seed303)
              source_dir=""
              source_commit=""
              released_case="${DIAG_CASE#wine_}"
              seed="${DIAG_CASE##*seed}"
              max_rows="100"
              module="benchmarks.diagnose_wine_quality_output"
              dataset_id="wine_quality_white"
              archive_name="wine_quality_white.zip"
              dataset_sha256="3ed56667f4b828242bd732d7d1dd7f2861e54432239d7fa63877014cbb0304d4"
              baseline="$GITHUB_WORKSPACE/diagnostic_outputs/reference-benchmark.json"
              provenance="$GITHUB_WORKSPACE/diagnostic_outputs/published-wheel.json"
              if [[ "$DIAG_CASE" == "wine_released_uniform_float32_seed101" ]]; then
                weights="uniform"
                released_archive="$GITHUB_WORKSPACE/benchmarks/results/released_wine_quality_float32_0.3.22.zip"
                released_archive_sha256="0654259363cd7c1d76f467fc06e5c3fd104f24198f9a7ef865569bdd2c4833bd"
                baseline_member="version_comparison_wine_quality_white_float32.json"
                baseline_sha256="e4b16d9794a944afc8e63dceffe2cb04a97132ff7f7a7228be562999757a7ece"
              else
                weights="distance"
                released_archive="$GITHUB_WORKSPACE/benchmarks/results/released_wine_quality_float32_distance_0.3.22.zip"
                released_archive_sha256="f6f3771b1385624306d7a28b22cbaff08383b5ed89a80c73c78e33b496291ddd"
                baseline_member="version_comparison_wine_quality_white_float32_distance.json"
                baseline_sha256="d78ed2d9f265be1363f57af372fa16b8ff65b2680ca0c7ba634253ba2aa30e9c"
              fi
              output_name="wine_quality_released_0.3.22_float32_${weights}_seed${seed}_diagnostic.json"
              echo "DIAG_EXPECTED_VERSION=0.3.22" >> "$GITHUB_ENV"
              ;;
            *)
              echo "Unsupported diagnostic: $DIAG_CASE" >&2
              exit 1
              ;;
          esac

          {
            echo "DIAG_BUILD_ENV=$RUNNER_TEMP/diagnostic-build-env"
            echo "DIAG_RUN_ENV=$RUNNER_TEMP/diagnostic-run-env"
            echo "DIAG_BUILD_DIR=$RUNNER_TEMP/diagnostic-build-source"
            echo "DIAG_RUN_DIR=$RUNNER_TEMP/real-data-diagnostic"
            echo "DIAG_DATA_HOME=$RUNNER_TEMP/diagnostic-data-cache"
            echo "DIAG_OUTPUT_DIR=$GITHUB_WORKSPACE/diagnostic_outputs"
            echo "DIAG_SOURCE_DIR=$source_dir"
            echo "DIAG_SOURCE_COMMIT=$source_commit"
            echo "DIAG_MODULE=$module"
            echo "DIAG_OUTPUT_NAME=$output_name"
            echo "DIAG_MAX_ROWS=$max_rows"
            echo "DIAG_DATASET_ID=$dataset_id"
            echo "DIAG_BASELINE=$baseline"
            echo "DIAG_ARCHIVE_NAME=$archive_name"
            echo "DIAG_RELEASED_CASE=$released_case"
            echo "DIAG_BASELINE_MEMBER=$baseline_member"
            echo "DIAG_BASELINE_SHA256=$baseline_sha256"
            echo "DIAG_DATASET_SHA256=$dataset_sha256"
            echo "DIAG_PROVENANCE=$provenance"
            echo "DIAG_RELEASED_ARCHIVE=$released_archive"
            echo "DIAG_RELEASED_ARCHIVE_SHA256=$released_archive_sha256"
          } >> "$GITHUB_ENV"

          mkdir -p "$GITHUB_WORKSPACE/diagnostic_outputs/wheels"

      - name: Build and fingerprint the selected library
        if: env.DIAG_RELEASED_CASE == ''
        run: |
          python -m venv "$DIAG_BUILD_ENV"
          "$DIAG_BUILD_ENV/bin/python" -m pip install \
            "build>=1.2" packaging

          mkdir -p "$DIAG_BUILD_DIR"
          git -C "$DIAG_SOURCE_DIR" archive HEAD \
            | tar -x -C "$DIAG_BUILD_DIR"

          "$DIAG_BUILD_ENV/bin/python" - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          import sys
          import tomllib

          from packaging.version import Version

          def commit_at(directory):
              return subprocess.check_output(
                  ["git", "-C", directory, "rev-parse", "HEAD"],
                  text=True,
              ).strip()

          source_commit = commit_at(os.environ["DIAG_SOURCE_DIR"])
          diagnostic_commit = commit_at(os.environ["GITHUB_WORKSPACE"])
          if source_commit != os.environ["DIAG_SOURCE_COMMIT"]:
              raise RuntimeError("Library checkout differs from the selected source")
          if diagnostic_commit != os.environ["GITHUB_SHA"]:
              raise RuntimeError("Diagnostic checkout differs from the workflow commit")

          build_directory = Path(os.environ["DIAG_BUILD_DIR"])
          output_directory = Path(os.environ["DIAG_OUTPUT_DIR"])
          project_path = build_directory / "pyproject.toml"

          source = project_path.read_text(encoding="utf-8")
          declared_version = tomllib.loads(source)["project"]["version"]
          candidate_version = (
              f"{Version(declared_version).public}"
              f"+bench.{source_commit[:12]}"
          )

          lines = source.splitlines(keepends=True)
          in_project = False
          replacements = 0

          for position, line in enumerate(lines):
              stripped = line.strip()
              if stripped.startswith("["):
                  section = stripped.split("#", 1)[0].strip()
                  in_project = section == "[project]"
              elif in_project and re.match(r"^\s*version\s*=", line):
                  lines[position] = f'version = "{candidate_version}"\n'
                  replacements += 1

          if replacements != 1:
              raise RuntimeError("Expected exactly one static version in [project]")

          updated = "".join(lines)
          if tomllib.loads(updated)["project"]["version"] != candidate_version:
              raise RuntimeError("Candidate version replacement failed")
          project_path.write_text(updated, encoding="utf-8")

          wheel_directory = output_directory / "wheels"
          subprocess.run(
              [
                  sys.executable, "-m", "build", "--wheel",
                  "--outdir", str(wheel_directory), str(build_directory),
              ],
              check=True,
          )
          wheels = list(wheel_directory.glob("*.whl"))
          if len(wheels) != 1:
              raise RuntimeError("Expected exactly one candidate wheel")
          wheel = wheels[0]

          provenance = {
              "version": candidate_version,
              "declared_version": declared_version,
              "source_commit": source_commit,
              "diagnostic_commit": diagnostic_commit,
              "diagnostic_case": os.environ["DIAG_CASE"],
              "wheel_filename": wheel.name,
              "wheel_sha256": hashlib.sha256(wheel.read_bytes()).hexdigest(),
              "github_run_id": os.environ["GITHUB_RUN_ID"],
              "github_run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
          }
          (output_directory / "candidate-build.json").write_text(
              json.dumps(provenance, indent=2) + "\n",
              encoding="utf-8",
          )

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as stream:
              stream.write(f"DIAG_EXPECTED_VERSION={candidate_version}\n")

          print(f"Candidate version: {candidate_version}")
          print(f"Library source: {source_commit}")
          print(f"Diagnostic source: {diagnostic_commit}")
          print(f"Wheel SHA256: {provenance['wheel_sha256']}")
          PY

      - name: Download and fingerprint the published PyPI 0.3.22 wheel
        if: env.DIAG_RELEASED_CASE != ''
        working-directory: ${{ runner.temp }}
        run: |
          python -m pip --isolated download \
            --only-binary=:all: \
            --no-deps \
            --index-url https://pypi.org/simple \
            --dest "$DIAG_OUTPUT_DIR/wheels" \
            "faiss-imputer==0.3.22"

          python - <<'PY'
          from email.parser import BytesParser
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess
          import zipfile

          output_directory = Path(os.environ["DIAG_OUTPUT_DIR"])
          wheels = list((output_directory / "wheels").glob("*.whl"))
          if len(wheels) != 1:
              raise RuntimeError("Expected exactly one published wheel")
          wheel = wheels[0]
          with zipfile.ZipFile(wheel) as archive:
              metadata_names = [
                  name for name in archive.namelist()
                  if name.endswith(".dist-info/METADATA")
              ]
              if len(metadata_names) != 1:
                  raise RuntimeError("Expected exactly one wheel metadata member")
              metadata = BytesParser().parsebytes(archive.read(metadata_names[0]))
          normalized_name = metadata["Name"].lower().replace("_", "-")
          if normalized_name != "faiss-imputer" or metadata["Version"] != "0.3.22":
              raise RuntimeError("Downloaded wheel is not faiss-imputer 0.3.22")

          diagnostic_commit = subprocess.check_output(
              ["git", "-C", os.environ["GITHUB_WORKSPACE"], "rev-parse", "HEAD"],
              text=True,
          ).strip()
          if diagnostic_commit != os.environ["GITHUB_SHA"]:
              raise RuntimeError("Diagnostic checkout differs from the workflow commit")

          archive_path = Path(os.environ["DIAG_RELEASED_ARCHIVE"])
          archive_sha256 = hashlib.sha256(archive_path.read_bytes()).hexdigest()
          if archive_sha256 != os.environ["DIAG_RELEASED_ARCHIVE_SHA256"]:
              raise RuntimeError("Released benchmark archive SHA256 mismatch")
          wheel_sha256 = hashlib.sha256(wheel.read_bytes()).hexdigest()
          provenance = {
              "kind": "published-wheel",
              "version": "0.3.22",
              "diagnostic_commit": diagnostic_commit,
              "diagnostic_case": os.environ["DIAG_CASE"],
              "wheel_filename": wheel.name,
              "wheel_sha256": wheel_sha256,
              "archive_sha256": archive_sha256,
              "github_run_id": os.environ["GITHUB_RUN_ID"],
              "github_run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
          }
          Path(os.environ["DIAG_PROVENANCE"]).write_text(
              json.dumps(provenance, indent=2) + "\n", encoding="utf-8",
          )
          (output_directory / "SHA256SUMS.txt").write_text(
              f"{wheel_sha256}  wheels/{wheel.name}\n"
              f"{archive_sha256}  {archive_path.name}\n",
              encoding="utf-8",
          )
          print("Published version: 0.3.22")
          print(f"Diagnostic source: {diagnostic_commit}")
          print(f"Wheel SHA256: {wheel_sha256}")
          print(f"Released benchmark archive SHA256: {archive_sha256}")
          PY

      - name: Install recorded numerical library versions
        run: |
          if [[ -n "$DIAG_RELEASED_CASE" ]]; then
            cd "$RUNNER_TEMP"
          fi
          python -m venv "$DIAG_RUN_ENV"

          libraries=(
            "numpy==2.5.3"
            "scikit-learn==1.9.1"
            "faiss-cpu==1.15.1"
          )
          if [[ -n "$DIAG_ARCHIVE_NAME" ]]; then
            libraries+=(
              "scipy==1.18.1"
              "threadpoolctl==3.7.0"
              "joblib==1.6.0"
              "cloudpickle==3.1.2"
              "narwhals==2.26.0"
              "packaging==26.3"
            )
          fi

          "$DIAG_RUN_ENV/bin/python" -m pip install \
            --only-binary=:all: \
            --report "$DIAG_OUTPUT_DIR/install-report.json" \
            "${libraries[@]}" \
            "$DIAG_OUTPUT_DIR"/wheels/*.whl

          "$DIAG_RUN_ENV/bin/python" -m pip check
          "$DIAG_RUN_ENV/bin/python" -m pip freeze \
            --exclude faiss-imputer \
            > "$DIAG_OUTPUT_DIR/dependencies.txt"
          "$DIAG_RUN_ENV/bin/python" -m pip list --format=json \
            > "$DIAG_OUTPUT_DIR/environment.json"

      - name: Prepare scripts, reference results, and archived data
        run: |
          mkdir -p "$DIAG_RUN_DIR" "$DIAG_DATA_HOME"
          cp -R "$GITHUB_WORKSPACE/benchmarks" "$DIAG_RUN_DIR/benchmarks"

          if [[ -n "$DIAG_RELEASED_CASE" ]]; then
            "$DIAG_RUN_ENV/bin/python" - <<'PY'
          import hashlib
          import io
          import os
          from pathlib import Path
          import zipfile

          output_directory = Path(os.environ["DIAG_OUTPUT_DIR"])
          archive_path = Path(os.environ["DIAG_RELEASED_ARCHIVE"])
          archive_bytes = archive_path.read_bytes()
          if hashlib.sha256(archive_bytes).hexdigest() != os.environ["DIAG_RELEASED_ARCHIVE_SHA256"]:
              raise RuntimeError("Released benchmark archive SHA256 mismatch")
          (output_directory / archive_path.name).write_bytes(archive_bytes)

          baseline_name = os.environ["DIAG_BASELINE_MEMBER"]
          archive_name = os.environ["DIAG_ARCHIVE_NAME"]
          dataset_name = f"datasets/{archive_name}"
          environment_names = (
              "current-environment.txt",
              "previous-environment.txt",
              "shared-dependencies.txt",
          )
          with zipfile.ZipFile(io.BytesIO(archive_bytes)) as archive:
              names = archive.namelist()
              required_names = (baseline_name, dataset_name, *environment_names)
              for name in required_names:
                  if names.count(name) != 1:
                      raise RuntimeError(f"Expected exactly one archived member: {name}")
              baseline_bytes = archive.read(baseline_name)
              dataset_bytes = archive.read(dataset_name)
              environments = {name: archive.read(name) for name in environment_names}

          if hashlib.sha256(baseline_bytes).hexdigest() != os.environ["DIAG_BASELINE_SHA256"]:
              raise RuntimeError("Selected reference JSON SHA256 mismatch")
          dataset_sha256 = os.environ["DIAG_DATASET_SHA256"]
          if hashlib.sha256(dataset_bytes).hexdigest() != dataset_sha256:
              raise RuntimeError("Archived dataset SHA256 mismatch")

          Path(os.environ["DIAG_BASELINE"]).write_bytes(baseline_bytes)
          (Path(os.environ["DIAG_DATA_HOME"]) / archive_name).write_bytes(dataset_bytes)
          source_data = output_directory / "source-data"
          source_data.mkdir(exist_ok=True)
          (source_data / archive_name).write_bytes(dataset_bytes)
          environment_directory = output_directory / "archived-environments"
          environment_directory.mkdir(exist_ok=True)
          for name, content in environments.items():
              (environment_directory / name).write_bytes(content)
          with (output_directory / "SHA256SUMS.txt").open("a", encoding="utf-8") as stream:
              stream.write(f"{os.environ['DIAG_BASELINE_SHA256']}  reference-benchmark.json\n")
              stream.write(f"{dataset_sha256}  source-data/{archive_name}\n")
              for name, content in environments.items():
                  stream.write(f"{hashlib.sha256(content).hexdigest()}  archived-environments/{name}\n")
          print(f"Reference member: {baseline_name}")
          print(f"Dataset archive SHA256: {dataset_sha256}")
          PY
          else
            cp "$DIAG_BASELINE" "$DIAG_OUTPUT_DIR/reference-benchmark.json"
            if [[ -n "$DIAG_ARCHIVE_NAME" ]]; then
              evidence="$GITHUB_WORKSPACE/benchmarks/results/real-data-datasets-ef04b1b"
              archive="$evidence/source-data/$DIAG_ARCHIVE_NAME"
              cp "$archive" "$DIAG_DATA_HOME/$DIAG_ARCHIVE_NAME"
              mkdir -p "$DIAG_OUTPUT_DIR/source-data"
              cp "$archive" "$DIAG_OUTPUT_DIR/source-data/$DIAG_ARCHIVE_NAME"
            fi
          fi

      - name: Load and fingerprint the selected dataset
        timeout-minutes: 5
        working-directory: ${{ env.DIAG_RUN_DIR }}
        run: |
          "$DIAG_RUN_ENV/bin/python" - <<'PY'
          import json
          import os
          from pathlib import Path

          from benchmarks.benchmark_real_data_cases import load_dataset
          from benchmarks.benchmark_scaling_threads import check_released_package

          check_released_package(os.environ["DIAG_EXPECTED_VERSION"])
          archived = bool(os.environ["DIAG_ARCHIVE_NAME"])
          data, names, dataset = load_dataset(
              os.environ["DIAG_DATA_HOME"],
              dataset_id=os.environ["DIAG_DATASET_ID"],
              download_if_missing=not archived,
          )
          destination = Path(os.environ["DIAG_OUTPUT_DIR"]) / "dataset.json"
          destination.write_text(
              json.dumps(dataset, indent=2, allow_nan=False) + "\n",
              encoding="utf-8",
          )
          print(f"Dataset shape: {data.shape}")
          print(f"Features: {names}")
          print(f"SHA256: {dataset['dataset_sha256']}")
          PY

      - name: Diagnose the selected single case
        timeout-minutes: 10
        working-directory: ${{ env.DIAG_RUN_DIR }}
        run: |
          case_arguments=()
          if [[ -n "$DIAG_RELEASED_CASE" ]]; then
            case_arguments+=(--case "$DIAG_RELEASED_CASE")
          fi
          "$DIAG_RUN_ENV/bin/python" -u \
            -m "$DIAG_MODULE" \
            "${case_arguments[@]}" \
            --expected-version "$DIAG_EXPECTED_VERSION" \
            --provenance "$DIAG_PROVENANCE" \
            --data-home "$DIAG_DATA_HOME" \
            --baseline "$DIAG_OUTPUT_DIR/reference-benchmark.json" \
            --threshold 1e-5 \
            --max-rows "$DIAG_MAX_ROWS" \
            --output "$DIAG_OUTPUT_DIR/$DIAG_OUTPUT_NAME"

      - name: Upload diagnostic results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: real-data-${{ env.DIAG_CASE }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: diagnostic_outputs/
          if-no-files-found: warn
          retention-days: 30
