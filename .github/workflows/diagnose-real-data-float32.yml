name: Real-data output diagnostic
run-name: "${{ inputs.diagnostic || 'wine_quality_float32' }} diagnostic (${{ github.ref_name }})"

on:
  workflow_dispatch:
    inputs:
      diagnostic:
        description: Case to diagnose
        required: true
        type: choice
        default: wine_quality_float32
        options:
          - wine_quality_float32
          - abalone_float64
          - california_float32

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    defaults:
      run:
        shell: bash

    env:
      DIAG_CASE: ${{ inputs.diagnostic || 'wine_quality_float32' }}
      PYTHONNOUSERSITE: "1"
      PYTHONHASHSEED: "0"
      PYTHONPATH: ""
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      BLIS_NUM_THREADS: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - name: Check out diagnostic source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check out the original benchmark library source
        if: env.DIAG_CASE == 'abalone_float64' || env.DIAG_CASE == 'wine_quality_float32'
        uses: actions/checkout@v7
        with:
          ref: ef04b1b0274d3abdd977440dd61e7d91e328c64d
          path: _diagnostic_library_source
          persist-credentials: false

      - name: Set up the recorded Python version
        uses: actions/setup-python@v7
        with:
          python-version: "3.12.14"

      - name: Initialize paths and selected case
        run: |
          source_dir="$GITHUB_WORKSPACE/_diagnostic_library_source"
          source_commit="ef04b1b0274d3abdd977440dd61e7d91e328c64d"
          evidence="$GITHUB_WORKSPACE/benchmarks/results/real-data-datasets-ef04b1b"

          case "$DIAG_CASE" in
            wine_quality_float32)
              module="benchmarks.diagnose_wine_quality_output"
              output_name="wine_quality_output_diagnostic.json"
              dataset_id="wine_quality_white"
              baseline="$evidence/wine-quality-white.json"
              archive_name="wine_quality_white.zip"
              ;;
            abalone_float64)
              module="benchmarks.diagnose_abalone_output"
              output_name="abalone_output_diagnostic.json"
              dataset_id="abalone"
              baseline="$evidence/abalone.json"
              archive_name="abalone.zip"
              ;;
            california_float32)
              source_dir="$GITHUB_WORKSPACE"
              source_commit="$GITHUB_SHA"
              module="benchmarks.diagnose_real_data_float32"
              output_name="real_data_float32_diagnostic.json"
              dataset_id="california_housing"
              baseline="$GITHUB_WORKSPACE/benchmarks/results/real-data-coverage-8f289647.json"
              archive_name=""
              ;;
            *)
              echo "Unsupported diagnostic: $DIAG_CASE" >&2
              exit 1
              ;;
          esac

          {
            echo "DIAG_BUILD_ENV=$RUNNER_TEMP/diagnostic-build-env"
            echo "DIAG_RUN_ENV=$RUNNER_TEMP/diagnostic-run-env"
            echo "DIAG_BUILD_DIR=$RUNNER_TEMP/diagnostic-build-source"
            echo "DIAG_RUN_DIR=$RUNNER_TEMP/real-data-diagnostic"
            echo "DIAG_DATA_HOME=$RUNNER_TEMP/diagnostic-data-cache"
            echo "DIAG_OUTPUT_DIR=$GITHUB_WORKSPACE/diagnostic_outputs"
            echo "DIAG_SOURCE_DIR=$source_dir"
            echo "DIAG_SOURCE_COMMIT=$source_commit"
            echo "DIAG_MODULE=$module"
            echo "DIAG_OUTPUT_NAME=$output_name"
            echo "DIAG_DATASET_ID=$dataset_id"
            echo "DIAG_BASELINE=$baseline"
            echo "DIAG_ARCHIVE_NAME=$archive_name"
          } >> "$GITHUB_ENV"

          mkdir -p "$GITHUB_WORKSPACE/diagnostic_outputs/wheels"

      - name: Build and fingerprint the selected library
        run: |
          python -m venv "$DIAG_BUILD_ENV"
          "$DIAG_BUILD_ENV/bin/python" -m pip install \
            "build>=1.2" packaging

          mkdir -p "$DIAG_BUILD_DIR"
          git -C "$DIAG_SOURCE_DIR" archive HEAD \
            | tar -x -C "$DIAG_BUILD_DIR"

          "$DIAG_BUILD_ENV/bin/python" - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          import sys
          import tomllib

          from packaging.version import Version

          def commit_at(directory):
              return subprocess.check_output(
                  ["git", "-C", directory, "rev-parse", "HEAD"],
                  text=True,
              ).strip()

          source_commit = commit_at(os.environ["DIAG_SOURCE_DIR"])
          diagnostic_commit = commit_at(os.environ["GITHUB_WORKSPACE"])
          if source_commit != os.environ["DIAG_SOURCE_COMMIT"]:
              raise RuntimeError("Library checkout differs from the selected source")
          if diagnostic_commit != os.environ["GITHUB_SHA"]:
              raise RuntimeError("Diagnostic checkout differs from the workflow commit")

          build_directory = Path(os.environ["DIAG_BUILD_DIR"])
          output_directory = Path(os.environ["DIAG_OUTPUT_DIR"])
          project_path = build_directory / "pyproject.toml"

          source = project_path.read_text(encoding="utf-8")
          declared_version = tomllib.loads(source)["project"]["version"]
          candidate_version = (
              f"{Version(declared_version).public}"
              f"+bench.{source_commit[:12]}"
          )

          lines = source.splitlines(keepends=True)
          in_project = False
          replacements = 0

          for position, line in enumerate(lines):
              stripped = line.strip()
              if stripped.startswith("["):
                  section = stripped.split("#", 1)[0].strip()
                  in_project = section == "[project]"
              elif in_project and re.match(r"^\s*version\s*=", line):
                  lines[position] = f'version = "{candidate_version}"\n'
                  replacements += 1

          if replacements != 1:
              raise RuntimeError("Expected exactly one static version in [project]")

          updated = "".join(lines)
          if tomllib.loads(updated)["project"]["version"] != candidate_version:
              raise RuntimeError("Candidate version replacement failed")
          project_path.write_text(updated, encoding="utf-8")

          wheel_directory = output_directory / "wheels"
          subprocess.run(
              [
                  sys.executable, "-m", "build", "--wheel",
                  "--outdir", str(wheel_directory), str(build_directory),
              ],
              check=True,
          )
          wheels = list(wheel_directory.glob("*.whl"))
          if len(wheels) != 1:
              raise RuntimeError("Expected exactly one candidate wheel")
          wheel = wheels[0]

          provenance = {
              "version": candidate_version,
              "declared_version": declared_version,
              "source_commit": source_commit,
              "diagnostic_commit": diagnostic_commit,
              "diagnostic_case": os.environ["DIAG_CASE"],
              "wheel_filename": wheel.name,
              "wheel_sha256": hashlib.sha256(wheel.read_bytes()).hexdigest(),
              "github_run_id": os.environ["GITHUB_RUN_ID"],
              "github_run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
          }
          (output_directory / "candidate-build.json").write_text(
              json.dumps(provenance, indent=2) + "\n",
              encoding="utf-8",
          )

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as stream:
              stream.write(f"DIAG_EXPECTED_VERSION={candidate_version}\n")

          print(f"Candidate version: {candidate_version}")
          print(f"Library source: {source_commit}")
          print(f"Diagnostic source: {diagnostic_commit}")
          print(f"Wheel SHA256: {provenance['wheel_sha256']}")
          PY

      - name: Install recorded numerical library versions
        run: |
          python -m venv "$DIAG_RUN_ENV"

          libraries=(
            "numpy==2.5.3"
            "scikit-learn==1.9.1"
            "faiss-cpu==1.15.1"
          )
          if [[ -n "$DIAG_ARCHIVE_NAME" ]]; then
            libraries+=(
              "scipy==1.18.1"
              "threadpoolctl==3.7.0"
              "joblib==1.6.0"
              "cloudpickle==3.1.2"
              "narwhals==2.26.0"
              "packaging==26.3"
            )
          fi

          "$DIAG_RUN_ENV/bin/python" -m pip install \
            --only-binary=:all: \
            --report "$DIAG_OUTPUT_DIR/install-report.json" \
            "${libraries[@]}" \
            "$DIAG_OUTPUT_DIR"/wheels/*.whl

          "$DIAG_RUN_ENV/bin/python" -m pip check
          "$DIAG_RUN_ENV/bin/python" -m pip freeze \
            --exclude faiss-imputer \
            > "$DIAG_OUTPUT_DIR/dependencies.txt"
          "$DIAG_RUN_ENV/bin/python" -m pip list --format=json \
            > "$DIAG_OUTPUT_DIR/environment.json"

      - name: Prepare scripts, reference results, and archived data
        run: |
          mkdir -p "$DIAG_RUN_DIR" "$DIAG_DATA_HOME"
          cp -R "$GITHUB_WORKSPACE/benchmarks" "$DIAG_RUN_DIR/benchmarks"
          cp "$DIAG_BASELINE" "$DIAG_OUTPUT_DIR/reference-benchmark.json"

          if [[ -n "$DIAG_ARCHIVE_NAME" ]]; then
            evidence="$GITHUB_WORKSPACE/benchmarks/results/real-data-datasets-ef04b1b"
            archive="$evidence/source-data/$DIAG_ARCHIVE_NAME"
            cp "$archive" "$DIAG_DATA_HOME/$DIAG_ARCHIVE_NAME"
            mkdir -p "$DIAG_OUTPUT_DIR/source-data"
            cp "$archive" "$DIAG_OUTPUT_DIR/source-data/$DIAG_ARCHIVE_NAME"
          fi

      - name: Load and fingerprint the selected dataset
        timeout-minutes: 5
        working-directory: ${{ env.DIAG_RUN_DIR }}
        run: |
          "$DIAG_RUN_ENV/bin/python" - <<'PY'
          import json
          import os
          from pathlib import Path

          from benchmarks.benchmark_real_data_cases import load_dataset
          from benchmarks.benchmark_scaling_threads import check_released_package

          check_released_package(os.environ["DIAG_EXPECTED_VERSION"])
          archived = bool(os.environ["DIAG_ARCHIVE_NAME"])
          data, names, dataset = load_dataset(
              os.environ["DIAG_DATA_HOME"],
              dataset_id=os.environ["DIAG_DATASET_ID"],
              download_if_missing=not archived,
          )
          destination = Path(os.environ["DIAG_OUTPUT_DIR"]) / "dataset.json"
          destination.write_text(
              json.dumps(dataset, indent=2, allow_nan=False) + "\n",
              encoding="utf-8",
          )
          print(f"Dataset shape: {data.shape}")
          print(f"Features: {names}")
          print(f"SHA256: {dataset['dataset_sha256']}")
          PY

      - name: Diagnose the selected single case
        timeout-minutes: 10
        working-directory: ${{ env.DIAG_RUN_DIR }}
        run: |
          "$DIAG_RUN_ENV/bin/python" -u \
            -m "$DIAG_MODULE" \
            --expected-version "$DIAG_EXPECTED_VERSION" \
            --provenance "$DIAG_OUTPUT_DIR/candidate-build.json" \
            --data-home "$DIAG_DATA_HOME" \
            --baseline "$DIAG_OUTPUT_DIR/reference-benchmark.json" \
            --threshold 1e-5 \
            --max-rows 20 \
            --output "$DIAG_OUTPUT_DIR/$DIAG_OUTPUT_NAME"

      - name: Upload diagnostic results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: real-data-${{ env.DIAG_CASE }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: diagnostic_outputs/
          if-no-files-found: warn
          retention-days: 30