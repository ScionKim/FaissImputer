name: Version comparison benchmark

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Compare branch candidate or published releases
        type: choice
        required: false
        default: candidate
        options:
          - candidate
          - released
      workload:
        description: Synthetic, Wine Quality White (float64 or float32), or Abalone
        type: choice
        required: false
        default: synthetic
        options:
          - synthetic
          - wine_quality_white
          - wine_quality_white_float32
          - abalone
      weights:
        description: Neighbor weights for real data; synthetic requires uniform
        type: choice
        required: false
        default: uniform
        options:
          - uniform
          - distance
      mechanism:
        description: Missingness for real data; synthetic requires MCAR
        type: choice
        required: false
        default: MCAR
        options:
          - MCAR
          - MAR
      baseline_commit:
        description: Optional baseline commit for candidate mode; blank uses PyPI 0.3.22
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    defaults:
      run:
        shell: bash

    env:
      REQUESTED_MODE: ${{ inputs.mode }}
      REQUESTED_WORKLOAD: ${{ inputs.workload }}
      REQUESTED_WEIGHTS: ${{ inputs.weights }}
      REQUESTED_MECHANISM: ${{ inputs.mechanism }}
      REQUESTED_BASELINE_COMMIT: ${{ inputs.baseline_commit }}
      PYTHONNOUSERSITE: "1"
      PYTHONHASHSEED: "0"
      PYTHONPATH: ""
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      BLIS_NUM_THREADS: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - name: Check out benchmark source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set comparison mode and paths
        run: |
          comparison_mode="${REQUESTED_MODE:-candidate}"

          case "$comparison_mode" in
            candidate) previous_version="0.3.22" ;;
            released) previous_version="0.3.21" ;;
            *)
              echo "Unknown comparison mode: $comparison_mode" >&2
              exit 1
              ;;
          esac

          benchmark_workload="${REQUESTED_WORKLOAD:-synthetic}"
          case "$benchmark_workload" in
            synthetic|wine_quality_white|wine_quality_white_float32|abalone) ;;
            *)
              echo "Unknown benchmark workload: $benchmark_workload" >&2
              exit 1
              ;;
          esac

          benchmark_weights="${REQUESTED_WEIGHTS:-uniform}"
          case "$benchmark_weights" in
            uniform) weights_suffix="" ;;
            distance) weights_suffix="_distance" ;;
            *)
              echo "Unknown neighbor weights: $benchmark_weights" >&2
              exit 1
              ;;
          esac

          benchmark_mechanism="${REQUESTED_MECHANISM:-MCAR}"
          case "$benchmark_mechanism" in
            MCAR) mechanism_suffix="" ;;
            MAR) mechanism_suffix="_mar" ;;
            *)
              echo "Unknown missingness mechanism: $benchmark_mechanism" >&2
              exit 1
              ;;
          esac

          if [[ "$benchmark_workload" == "synthetic" &&
                "$benchmark_weights" != "uniform" ]]; then
            echo "Synthetic workloads require weights=uniform." >&2
            exit 1
          fi

          if [[ "$benchmark_workload" == "synthetic" &&
                "$benchmark_mechanism" != "MCAR" ]]; then
            echo "Synthetic workloads require mechanism=MCAR." >&2
            exit 1
          fi

          if [[ "$benchmark_workload" != "synthetic" ]]; then
            if [[ "$comparison_mode" != "released" ]]; then
              echo "Real-data workloads require mode=released." >&2
              exit 1
            fi
            if [[ -n "${REQUESTED_BASELINE_COMMIT:-}" ]]; then
              echo "Real-data workloads require an empty baseline_commit." >&2
              exit 1
            fi
          fi

          {
            echo "COMPARISON_MODE=$comparison_mode"
            echo "BENCHMARK_WORKLOAD=$benchmark_workload"
            echo "BENCHMARK_WEIGHTS=$benchmark_weights"
            echo "BENCHMARK_WEIGHTS_SUFFIX=$weights_suffix"
            echo "BENCHMARK_MECHANISM=$benchmark_mechanism"
            echo "BENCHMARK_MECHANISM_SUFFIX=$mechanism_suffix"
            echo "PREVIOUS_VERSION=$previous_version"
            echo "CURRENT_VERSION=0.3.22"
            echo "CURRENT_ENV=$RUNNER_TEMP/faiss-current"
            echo "PREVIOUS_ENV=$RUNNER_TEMP/faiss-previous"
            echo "BUILD_ENV=$RUNNER_TEMP/faiss-build"
            echo "BUILD_DIR=$RUNNER_TEMP/faiss-candidate-source"
            echo "WHEEL_DIR=$RUNNER_TEMP/faiss-candidate-wheels"
            echo "BENCHMARK_DIR=$RUNNER_TEMP/version-benchmark"
          } >> "$GITHUB_ENV"

          mkdir -p "$GITHUB_WORKSPACE/benchmark_outputs"

      - name: Build candidate wheel
        if: env.COMPARISON_MODE == 'candidate'
        run: |
          python -m venv "$BUILD_ENV"
          "$BUILD_ENV/bin/python" -m pip install "build>=1.2"

          mkdir -p "$BUILD_DIR" "$WHEEL_DIR"
          git archive HEAD | tar -x -C "$BUILD_DIR"

          "$BUILD_ENV/bin/python" - <<'PY'
          import json
          import os
          import re
          import subprocess
          import tomllib
          from pathlib import Path

          from packaging.version import Version

          project_path = Path(os.environ["BUILD_DIR"]) / "pyproject.toml"
          source = project_path.read_text(encoding="utf-8")
          declared_version = tomllib.loads(source)["project"]["version"]
          source_sha = subprocess.check_output(
              ["git", "rev-parse", "HEAD"], text=True
          ).strip()
          candidate_version = (
              f"{Version(declared_version).public}+bench.{source_sha[:12]}"
          )

          lines = source.splitlines(keepends=True)
          in_project = False
          replacements = 0

          for position, line in enumerate(lines):
              stripped = line.strip()
              if stripped.startswith("["):
                  section = stripped.split("#", 1)[0].strip()
                  in_project = section == "[project]"
              elif in_project and re.match(r"^\s*version\s*=", line):
                  lines[position] = f'version = "{candidate_version}"\n'
                  replacements += 1

          if replacements != 1:
              raise RuntimeError(
                  "Expected exactly one static version in [project]"
              )

          project_path.write_text("".join(lines), encoding="utf-8")

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as stream:
              stream.write(f"CURRENT_VERSION={candidate_version}\n")

          provenance = {
              "comparison_mode": "candidate",
              "source_commit": source_sha,
              "declared_version": declared_version,
              "candidate_wheel_version": candidate_version,
          }
          destination = (
              Path(os.environ["GITHUB_WORKSPACE"])
              / "benchmark_outputs"
              / "candidate-build.json"
          )
          destination.write_text(
              json.dumps(provenance, indent=2) + "\n",
              encoding="utf-8",
          )
          print(f"Candidate wheel version: {candidate_version}")
          PY

          "$BUILD_ENV/bin/python" -m build \
            --wheel \
            --outdir "$WHEEL_DIR" \
            "$BUILD_DIR"

      - name: Check out comparison baseline
        if: env.COMPARISON_MODE == 'candidate' && inputs.baseline_commit != ''
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.baseline_commit }}
          path: benchmark-baseline-source
          persist-credentials: false

      - name: Build baseline wheel
        if: env.COMPARISON_MODE == 'candidate' && inputs.baseline_commit != ''
        run: |
          mkdir -p \
            "$RUNNER_TEMP/faiss-baseline-source" \
            "$RUNNER_TEMP/faiss-baseline-wheels"

          git -C "$GITHUB_WORKSPACE/benchmark-baseline-source" archive HEAD \
            | tar -x -C "$RUNNER_TEMP/faiss-baseline-source"

          "$BUILD_ENV/bin/python" - <<'PY'
          import json
          import os
          import re
          import subprocess
          import tomllib
          from pathlib import Path

          from packaging.version import Version

          temporary = Path(os.environ["RUNNER_TEMP"])
          workspace = Path(os.environ["GITHUB_WORKSPACE"])
          checkout = workspace / "benchmark-baseline-source"
          project_path = temporary / "faiss-baseline-source" / "pyproject.toml"

          source = project_path.read_text(encoding="utf-8")
          declared_version = tomllib.loads(source)["project"]["version"]
          source_sha = subprocess.check_output(
              ["git", "-C", str(checkout), "rev-parse", "HEAD"],
              text=True,
          ).strip()
          baseline_version = (
              f"{Version(declared_version).public}+bench.{source_sha[:12]}"
          )

          lines = source.splitlines(keepends=True)
          in_project = False
          replacements = 0

          for position, line in enumerate(lines):
              stripped = line.strip()
              if stripped.startswith("["):
                  section = stripped.split("#", 1)[0].strip()
                  in_project = section == "[project]"
              elif in_project and re.match(r"^\s*version\s*=", line):
                  lines[position] = f'version = "{baseline_version}"\n'
                  replacements += 1

          if replacements != 1:
              raise RuntimeError(
                  "Expected exactly one static version in [project]"
              )

          project_path.write_text("".join(lines), encoding="utf-8")

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as stream:
              stream.write(f"PREVIOUS_VERSION={baseline_version}\n")
              stream.write(
                  f"BASELINE_WHEEL_DIR={temporary / 'faiss-baseline-wheels'}\n"
              )

          provenance = {
              "comparison_role": "baseline",
              "source_commit": source_sha,
              "declared_version": declared_version,
              "baseline_wheel_version": baseline_version,
          }
          destination = workspace / "benchmark_outputs" / "baseline-build.json"
          destination.write_text(
              json.dumps(provenance, indent=2) + "\n",
              encoding="utf-8",
          )
          print(f"Baseline wheel version: {baseline_version}")
          PY

          "$BUILD_ENV/bin/python" -m build \
            --wheel \
            --outdir "$RUNNER_TEMP/faiss-baseline-wheels" \
            "$RUNNER_TEMP/faiss-baseline-source"

      - name: Install packages with matching dependencies
        run: |
          python -m venv "$CURRENT_ENV"
          python -m venv "$PREVIOUS_ENV"

          if [[ "$COMPARISON_MODE" == "candidate" ]]; then
            "$CURRENT_ENV/bin/python" -m pip install \
              --only-binary=:all: \
              "$WHEEL_DIR"/*.whl
          else
            "$CURRENT_ENV/bin/python" -m pip install \
              --only-binary=:all: \
              "faiss-imputer==$CURRENT_VERSION"
          fi

          "$CURRENT_ENV/bin/python" -m pip freeze \
            --exclude faiss-imputer \
            > "$GITHUB_WORKSPACE/benchmark_outputs/shared-dependencies.txt"

          "$PREVIOUS_ENV/bin/python" -m pip install \
            --only-binary=:all: \
            -r "$GITHUB_WORKSPACE/benchmark_outputs/shared-dependencies.txt"

          if [[ -n "${BASELINE_WHEEL_DIR:-}" ]]; then
            "$PREVIOUS_ENV/bin/python" -m pip install \
              --only-binary=:all: \
              --no-deps \
              "$BASELINE_WHEEL_DIR"/*.whl
          else
            "$PREVIOUS_ENV/bin/python" -m pip install \
              --only-binary=:all: \
              --no-deps \
              "faiss-imputer==$PREVIOUS_VERSION"
          fi

          "$CURRENT_ENV/bin/python" -m pip check
          "$PREVIOUS_ENV/bin/python" -m pip check

          "$CURRENT_ENV/bin/python" -m pip freeze \
            > "$GITHUB_WORKSPACE/benchmark_outputs/current-environment.txt"

          "$PREVIOUS_ENV/bin/python" -m pip freeze \
            > "$GITHUB_WORKSPACE/benchmark_outputs/previous-environment.txt"

      - name: Prepare benchmark outside the checkout
        run: |
          mkdir -p "$BENCHMARK_DIR"
          cp -R "$GITHUB_WORKSPACE/benchmarks" "$BENCHMARK_DIR/benchmarks"

      - name: Run sequential query-count comparison
        if: env.BENCHMARK_WORKLOAD == 'synthetic'
        working-directory: ${{ env.BENCHMARK_DIR }}
        run: |
          set -euo pipefail
          comparison_started_at=$SECONDS

          if [[ "$COMPARISON_MODE" == "released" ]]; then
            query_counts=(300)
          else
            query_counts=(300 1000 3000)
          fi

          for query_count in "${query_counts[@]}"; do
            remaining_seconds=$((1800 - (SECONDS - comparison_started_at)))

            if (( remaining_seconds <= 0 )); then
              echo "Benchmark budget exhausted before ${query_count} queries." >&2
              exit 1
            fi

            echo "Comparing ${query_count} queries; ${remaining_seconds}s remaining."

            "$CURRENT_ENV/bin/python" -u \
              -m benchmarks.benchmark_released_versions \
              --previous-python "$PREVIOUS_ENV/bin/python" \
              --previous-version "$PREVIOUS_VERSION" \
              --current-version "$CURRENT_VERSION" \
              --train-size 20000 \
              --queries "$query_count" \
              --seeds 101 202 303 \
              --repeats 3 \
              --repeated-transforms 2 \
              --timeout-seconds 180 \
              --budget-seconds "$remaining_seconds" \
              --output "$GITHUB_WORKSPACE/benchmark_outputs/version_comparison_q${query_count}.json"
          done

      - name: Run sequential Wine Quality White comparison
        if: env.BENCHMARK_WORKLOAD == 'wine_quality_white' || env.BENCHMARK_WORKLOAD == 'wine_quality_white_float32'
        working-directory: ${{ env.BENCHMARK_DIR }}
        run: |
          set -euo pipefail
          wine_dtype="float64"
          wine_dtype_suffix=""
          if [[ "$BENCHMARK_WORKLOAD" == "wine_quality_white_float32" ]]; then
            wine_dtype="float32"
            wine_dtype_suffix="_float32"
          fi

          echo "Comparing Wine Quality White ${wine_dtype}; weights=${BENCHMARK_WEIGHTS}; mechanism=${BENCHMARK_MECHANISM}."

          "$CURRENT_ENV/bin/python" -u \
            -m benchmarks.benchmark_released_real_data \
            --previous-python "$PREVIOUS_ENV/bin/python" \
            --previous-version "$PREVIOUS_VERSION" \
            --current-version "$CURRENT_VERSION" \
            --dataset wine_quality_white \
            --dtype "$wine_dtype" \
            --weights "$BENCHMARK_WEIGHTS" \
            --mechanism "$BENCHMARK_MECHANISM" \
            --data-home "$GITHUB_WORKSPACE/benchmark_outputs/datasets" \
            --timeout-seconds 300 \
            --budget-seconds 1200 \
            --output "$GITHUB_WORKSPACE/benchmark_outputs/version_comparison_wine_quality_white${wine_dtype_suffix}${BENCHMARK_WEIGHTS_SUFFIX}${BENCHMARK_MECHANISM_SUFFIX}.json"

      - name: Run sequential Abalone comparisons
        if: env.BENCHMARK_WORKLOAD == 'abalone'
        working-directory: ${{ env.BENCHMARK_DIR }}
        run: |
          set -euo pipefail
          comparison_started_at=$SECONDS
          comparison_failed=0

          for dtype in float32 float64; do
            remaining_seconds=$((1200 - (SECONDS - comparison_started_at)))
            if (( remaining_seconds <= 0 )); then
              echo "Benchmark budget exhausted before Abalone ${dtype}." >&2
              exit 1
            fi

            echo "Comparing Abalone ${dtype}; weights=${BENCHMARK_WEIGHTS}; mechanism=${BENCHMARK_MECHANISM}; ${remaining_seconds}s remaining."
            if ! "$CURRENT_ENV/bin/python" -u \
              -m benchmarks.benchmark_released_real_data \
              --previous-python "$PREVIOUS_ENV/bin/python" \
              --previous-version "$PREVIOUS_VERSION" \
              --current-version "$CURRENT_VERSION" \
              --dataset abalone \
              --dtype "$dtype" \
              --weights "$BENCHMARK_WEIGHTS" \
              --mechanism "$BENCHMARK_MECHANISM" \
              --data-home "$GITHUB_WORKSPACE/benchmark_outputs/datasets" \
              --timeout-seconds 300 \
              --budget-seconds "$remaining_seconds" \
              --output "$GITHUB_WORKSPACE/benchmark_outputs/version_comparison_abalone_${dtype}${BENCHMARK_WEIGHTS_SUFFIX}${BENCHMARK_MECHANISM_SUFFIX}.json"; then
              comparison_failed=1
            fi
          done

          exit "$comparison_failed"

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: version-benchmark-${{ github.run_id }}-${{ github.run_attempt }}
          path: benchmark_outputs/
          if-no-files-found: warn
          retention-days: 30
