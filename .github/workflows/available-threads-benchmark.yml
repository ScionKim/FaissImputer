name: Available thread benchmark

on:
  push:
    branches:
      - bench/scaling-threads
    paths:
      - benchmarks/benchmark_available_threads.py
      - .github/workflows/available-threads-benchmark.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: available-threads-${{ github.ref }}
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      BLIS_NUM_THREADS: "1"
      OMP_DYNAMIC: "FALSE"
      MKL_DYNAMIC: "FALSE"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip check

      - name: Run available-thread benchmark
        run: >
          python -u -m benchmarks.benchmark_available_threads
          --train-sizes 500000
          --threads 1 2 4
          --queries 300
          --seeds 101
          --patterns random
          --repeats 3
          --timeout-seconds 180
          --budget-seconds 900
          --output benchmark_outputs/available_threads.json

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: available-threads-benchmark
          path: benchmark_outputs/available_threads.json
          if-no-files-found: error
          retention-days: 14
