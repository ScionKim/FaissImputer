name: Verify benchmark correctness

# On the existing diagnosis branch, commit these files with [benchmark-correctness]
# in the head commit message to request the first run before merging.
# After merge, workflow_dispatch may run this same workflow from main.
# GitHub run reruns are rejected; a new deliberate trigger is required.
on:
  push:
    branches:
      - diagnose/ordered-transform-calls
    paths:
      - benchmarks/verify_benchmark_correctness.py
      - benchmarks/specs/validation_0.3.22_v3.json
      - tests/test_benchmark_correctness.py
      - .github/workflows/verify-benchmark-correctness.yml
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: benchmark-correctness-${{ github.ref }}
  cancel-in-progress: false

env:
  OMP_NUM_THREADS: '1'
  OMP_THREAD_LIMIT: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  BLIS_NUM_THREADS: '1'
  VECLIB_MAXIMUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'
  NUMEXPR_MAX_THREADS: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  PIP_NO_INPUT: '1'

jobs:
  reject-invalid-request:
    if: >-
      (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[benchmark-correctness]')) &&
      (github.run_attempt != '1' ||
       (github.ref != 'refs/heads/main' && github.ref != 'refs/heads/diagnose/ordered-transform-calls'))
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Reject rerun or invalid branch
        run: |
          echo '::error::Run from main or diagnose/ordered-transform-calls with run_attempt=1. Rerunning an existing GitHub run is disabled; use a new deliberate trigger.'
          exit 1

  verify:
    if: >-
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/diagnose/ordered-transform-calls') &&
      github.run_attempt == '1' &&
      (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[benchmark-correctness]'))
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download pinned published wheels outside the artifact directory
        env:
          WHEEL_DIR: ${{ runner.temp }}/benchmark-correctness-wheels
        run: |
          mkdir -p correctness-artifacts "$WHEEL_DIR"
          python -m pip download --only-binary=:all: --dest "$WHEEL_DIR" \
            'faiss-imputer==0.3.22' \
            'numpy==2.5.3' \
            'scikit-learn==1.9.1' \
            'faiss-cpu==1.15.1' 'pytest>=8' \
            2>&1 | tee correctness-artifacts/wheel-download.log
          python -I - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          wheels = sorted(Path(os.environ['WHEEL_DIR']).glob('*.whl'))
          if not wheels:
              raise SystemExit('The wheel download produced no wheel files')
          records = [
              {'filename': wheel.name, 'sha256': hashlib.sha256(wheel.read_bytes()).hexdigest()}
              for wheel in wheels
          ]
          output = Path('correctness-artifacts')
          (output / 'wheel-files.json').write_text(
              json.dumps(records, indent=2) + '\n', encoding='utf-8'
          )
          (output / 'wheel-sha256.txt').write_text(
              ''.join(f"{record['sha256']}  {record['filename']}\n" for record in records),
              encoding='utf-8',
          )
          PY

      - name: Install the downloaded published wheels
        env:
          WHEEL_DIR: ${{ runner.temp }}/benchmark-correctness-wheels
        run: |
          python -m pip install --no-index --find-links "$WHEEL_DIR" \
            --only-binary=:all: --force-reinstall \
            'faiss-imputer==0.3.22' \
            'numpy==2.5.3' \
            'scikit-learn==1.9.1' \
            'faiss-cpu==1.15.1' 'pytest>=8' \
            2>&1 | tee correctness-artifacts/wheel-install.log
          python -m pip freeze --all > correctness-artifacts/pip-freeze.txt
          python -m pip check 2>&1 | tee correctness-artifacts/pip-check.txt

      - name: Record environment and installed-package provenance
        env:
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          SPEC_REVISION: validation_0.3.22_v3
        run: |
          python -I - <<'PY'
          import importlib.metadata as metadata
          import importlib.util
          import json
          import os
          from pathlib import Path
          import platform
          import sys

          output = Path('correctness-artifacts')
          output.mkdir(exist_ok=True)
          cpu_model = next(
              (line.split(':', 1)[1].strip() for line in Path('/proc/cpuinfo').read_text().splitlines()
               if line.startswith('model name')),
              None,
          )
          memory_kib = next(
              (int(line.split()[1]) for line in Path('/proc/meminfo').read_text().splitlines()
               if line.startswith('MemTotal:')),
              None,
          )
          module_origins = {}
          for name in ('faiss_imputer', 'faiss', 'numpy', 'sklearn'):
              module = importlib.util.find_spec(name)
              module_origins[name] = (
                  str(Path(module.origin).resolve()) if module and module.origin else None
              )
          package_versions = {
              dist.metadata['Name']: dist.version
              for dist in metadata.distributions()
              if dist.metadata.get('Name')
          }
          record = {
              'runner_image': os.environ.get('ImageOS'),
              'runner_image_version': os.environ.get('ImageVersion'),
              'runner_os': os.environ.get('RUNNER_OS'),
              'runner_arch': os.environ.get('RUNNER_ARCH'),
              'os': platform.platform(),
              'cpu_model': cpu_model,
              'logical_cpu_count': os.cpu_count(),
              'memory_bytes': memory_kib * 1024 if memory_kib is not None else None,
              'python_version': sys.version,
              'python_executable': sys.executable,
              'package_versions': dict(sorted(package_versions.items())),
              'installed_package_origin': module_origins['faiss_imputer'],
              'installed_module_origins': module_origins,
              'wheel_sha256': (output / 'wheel-sha256.txt').read_text(),
              'wheel_files': json.loads((output / 'wheel-files.json').read_text()),
              'workflow_sha': os.environ.get('WORKFLOW_SHA'),
              'git_sha': os.environ.get('GITHUB_SHA'),
              'github_run_id': os.environ.get('GITHUB_RUN_ID'),
              'github_run_attempt': os.environ.get('GITHUB_RUN_ATTEMPT'),
              'github_job': os.environ.get('GITHUB_JOB'),
              'github_event_name': os.environ.get('GITHUB_EVENT_NAME'),
              'github_ref': os.environ.get('GITHUB_REF'),
              'spec_revision': os.environ.get('SPEC_REVISION'),
              'verification_kind': 'correctness-only',
              'worker_count': 18,
              'policy_order': ['complete', 'available'],
              'seeds_per_policy': 3,
              'repeats_per_seed': 3,
              'worker_timeout_seconds': 300,
              'total_timeout_seconds': 1500,
              'same_worker_call_order': [
                  'Faiss float32 calls 1-6',
                  'Faiss float64 calls 1-6',
                  'KNN float32 calls 1-6',
                  'KNN float64 calls 1-6',
              ],
              'threads': {name: os.environ.get(name) for name in (
                  'OMP_NUM_THREADS', 'OMP_THREAD_LIMIT', 'OPENBLAS_NUM_THREADS',
                  'MKL_NUM_THREADS', 'BLIS_NUM_THREADS', 'VECLIB_MAXIMUM_THREADS',
                  'NUMEXPR_NUM_THREADS', 'NUMEXPR_MAX_THREADS',
              )},
          }
          record['missing_field_reasons'] = {
              key: 'Not supplied by the runner or unavailable from this host.'
              for key, value in record.items() if value is None
          }
          record['missing_field_reasons'].update({
              f'installed_module_origins.{name}': 'Module could not be located in the isolated interpreter.'
              for name, origin in module_origins.items() if origin is None
          })
          (output / 'environment.json').write_text(
              json.dumps(record, indent=2) + '\n', encoding='utf-8'
          )
          expected = {
              'faiss-imputer': '0.3.22',
              'numpy': '2.5.3',
              'scikit-learn': '1.9.1',
              'faiss-cpu': '1.15.1',
          }
          for name, version in expected.items():
              if metadata.version(name) != version:
                  raise SystemExit(f'Unexpected installed version for {name}')
          if sys.version_info[:2] != (3, 12):
              raise SystemExit('Python 3.12 is required')
          for name, origin in module_origins.items():
              if origin is None or Path(origin).is_relative_to(Path.cwd().resolve()):
                  raise SystemExit(f'{name} must resolve outside the checked-out repository')
          PY

      - name: Check correctness orchestration before the real verification
        run: |
          python -m pytest -q --noconftest tests/test_benchmark_correctness.py \
            2>&1 | tee correctness-artifacts/correctness-unit-tests.log

      # The driver enforces the 300-second worker and 1500-second total bounds.
      # Each policy has three seeds x three repeats, each in a fresh worker.
      # Each worker runs Faiss f32 calls 1-6, Faiss f64 calls 1-6,
      # KNN f32 calls 1-6, then KNN f64 calls 1-6, without stage tracing
      # or fit/transform performance measurements.
      - name: Verify complete then available policies in 18 sequential fresh workers
        run: |
          python -I benchmarks/verify_benchmark_correctness.py \
            --spec benchmarks/specs/validation_0.3.22_v3.json \
            --output correctness-artifacts/benchmark-correctness.json \
            2>&1 | tee correctness-artifacts/correctness-console.log

      - name: Upload source, specification, provenance and partial correctness results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-correctness-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          if-no-files-found: warn
          include-hidden-files: true
          path: |
            correctness-artifacts/
            benchmarks/verify_benchmark_correctness.py
            benchmarks/specs/validation_0.3.22_v3.json
            tests/test_benchmark_correctness.py
            .github/workflows/verify-benchmark-correctness.yml
            benchmarks/benchmark_scaling_threads.py
            benchmarks/benchmark_imputers.py
            !**/*.whl
