name: Paired workload scaling benchmark

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: paired-workload-scaling-benchmark
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PAIRED_OUTPUT_DIR: ${{ github.workspace }}/paired-results
      PYTHONHASHSEED: '0'
      PYTHONPATH: ''
      PYTHONNOUSERSITE: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      BLIS_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      OMP_DYNAMIC: 'FALSE'
      MKL_DYNAMIC: 'FALSE'

    steps:
      - name: Check out v0.3.8
        uses: actions/checkout@v7
        with:
          ref: v0.3.8
          path: baseline
          persist-credentials: false

      - name: Check out v0.3.9
        uses: actions/checkout@v7
        with:
          ref: v0.3.9
          path: candidate
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install shared dependencies and record environment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$PAIRED_OUTPUT_DIR"
          python -m pip install 'numpy==2.5.2' 'scikit-learn==1.9.0' 'faiss-cpu==1.15.0'
          python -m pip check
          python -m pip freeze --all > "$PAIRED_OUTPUT_DIR/pip-freeze.txt"
          lscpu > "$PAIRED_OUTPUT_DIR/lscpu.txt"

      - name: Measure both releases on this runner
        timeout-minutes: 35
